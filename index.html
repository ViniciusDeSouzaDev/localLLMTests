function showGameover(){
  overShown = true;
  const isRecord = score > save.best;
  if(isRecord) save.best = score;
  if(mode === 'rl' && run){
    save.rl.bestStage = Math.max(save.rl.bestStage, run.stage);
    save.rl.bestPipes = Math.max(save.rl.bestPipes, run.totalPipes);
    $('#rlStats').textContent = T('rlStats').replace('{p}', run.path).replace('{s}', run.stage).replace('{r}', pathCfg().rows).replace('{n}', run.totalPipes).replace('{g}', run.gold);
    $('#rlStats').classList.remove('hidden');
  } else {
    $('#rlStats').classList.add('hidden');
  }
  persist();
  $('#finalScore').textContent = score;
  $('#bestScore').textContent = save.best;
  $('#newRecord').classList.toggle('hidden', !isRecord);
  const mm = mode === 'rl' ? 10 : 1;
  const medal =
    score>=50*mm ? {n:'diamond', c:'#7ee8f2'} :
    score>=40*mm ? {n:'platinum', c:'#cfd6dd'} :
    score>=30*mm ? {n:'gold', c:'#ffd700'} :
    score>=20*mm ? {n:'silver', c:'#c0c8d0'} :
    score>=10*mm ? {n:'bronze', c:'#cd7f32'} : null;
  const m = $('#medal');
  if(medal){
    m.textContent = T(medal.n);
    m.style.background = `radial-gradient(circle at 35% 30%, #fff, ${medal.c} 55%, rgba(0,0,0,.25))`;
  } else { m.textContent = T('noMedal'); m.style.background = 'rgba(255,255,255,.15)'; }
  show('#gameover', true);
  AudioFX.startMusic('gameover');
  checkUnlocks();
}

function checkUnlocks(){
  for(const s of SKINS){
    if(save.total >= s.unlock && !save.unlocked.includes(s.id)){
      save.unlocked.push(s.id);
      persist();
      showToast(T('skinUnlocked').replace('{n}', s.name));
      AudioFX.unlock();
      buildShop();
    }
  }
}

/* ================= update ================= */
function pipeSpeed(){
  const base = (140 + Math.min(score,40)*1.5) * (feverT > 0 ? 1.3 : 1);
  if(mode==='rl' && run) return base + 12*(run.stage-1) + (run.path === 2 ? 14 : 0);
  return base;
}
function pipeGap(){
  if(mode==='rl' && run){
    const p2 = run.path === 2;
    return Math.max(p2 ? 95 : 105, 170 - (run.stage-1)*(p2 ? 9 : 7) - score*0.3);
  }
  return Math.max(115, 160 - score*1.5);
}

function update(dt){
  t += dt;
  const nf = nightFactor();

  // clouds / fireflies
  for(const c of clouds){ c.x -= c.spd*dt; if(c.x < -160) { c.x = W+160; c.y = rand(60,300); } }
  for(const f of fireflies){ f.p += dt; f.x += Math.sin(f.p*1.3)*30*dt; f.y += Math.cos(f.p*0.9)*22*dt; }

  // theme particles
  if(theme === 'snow'){
    for(const s of fxParts){
      s.y += s.spd*dt; s.x += s.drift*dt;
      if(s.y > GROUND_Y){ s.y = -5; s.x = Math.random()*W; }
      if(s.x < -5) s.x = W+5; else if(s.x > W+5) s.x = -5;
    }
  } else if(theme === 'desert'){
    for(const d of fxParts){
      d.x -= (40 + 20*Math.sin(t*3 + d.p))*dt;
      if(d.x < -5){ d.x = W+5; d.y = Math.random()*GROUND_Y*0.8; }
    }
  }

  // particles / popups / trail
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 500*dt;
    if(p.life <= 0) particles.splice(i,1);
  }
  for(let i=popups.length-1;i>=0;i--){
    const p = popups[i]; p.life -= dt; p.y -= 40*dt;
    if(p.life <= 0) popups.splice(i,1);
  }
  for(let i=trail.length-1;i>=0;i--){ trail[i].life -= dt; if(trail[i].life<=0) trail.splice(i,1); }

  shake = Math.max(0, shake - dt*30);
  flash = Math.max(0, flash - dt*2.5);
  invuln = Math.max(0, invuln - dt);
  feverT = Math.max(0, feverT - dt);
  refreshComboTag();
  const pw = (mode==='rl' && run) ? mods() : powers();

  if(state === 'ready'){
    bird.y = H*0.45 + Math.sin(t*3)*9;
    bird.rot = Math.sin(t*3+0.5)*0.08;
    bird.wing = Math.sin(t*8)*0.5+0.5;
    groundX = (groundX + 60*dt) % 48;
  }
  else if(state === 'play'){
    if(stageClearT > 0 && rebornT <= 0){
      bird.y = H*0.45 + Math.sin(t*3)*9;
      bird.rot = Math.sin(t*3+0.5)*0.08;
      bird.wing = Math.sin(t*8)*0.5+0.5;
    } else {
      let windG = 1;
      if(run && run.boss){
        const wphs = run.boss.def.phases;
        const widx = Math.min(wphs.length-1, Math.floor(run.boss.passes * wphs.length / run.boss.max));
        if(wphs[widx].pattern === 'wind') windG = wphs[widx].g || 1.2;
      }
      bird.vy = Math.min(700, bird.vy + 1400*pw.grav*windG*dt);
      bird.y += bird.vy*dt;
      bird.rot += (clamp(bird.vy/500, -0.35, 0.9) - bird.rot)*Math.min(1, dt*8);
      bird.wing = Math.max(0, bird.wing - dt*3);
    }
    trail.push({ x:BIRD_X, y:bird.y, life:0.4, max:0.4 });

    if(rebornT > 0){
      rebornT -= dt;
      if(rebornT <= 0){
        bird.y = H*0.45; bird.vy = 0; bird.rot = 0;
        invuln = 2.5; flash = 0.5;
        pipes = pipes.filter(q => q.x < BIRD_X-260 || q.x > BIRD_X+260);
        popups.push({ x:BIRD_X, y:bird.y-34, txt:T('again'), life:0.9, max:0.9 });
        AudioFX.unlock();
      }
    }

    groundX = (groundX + pipeSpeed()*pw.speed*dt) % 48;

    // stage clear pause (roguelike)
    if(stageClearT > 0){
      stageClearT -= dt;
      if(stageClearT <= 0) openDraft(rollCards());
    }

    // spawn pipes
    const last = pipes[pipes.length-1];
    if(mode==='rl' && run.boss){
      if(!pipes.some(p => p.boss)){
        const bg = pipeGap();
        pipes.push({ x:W+40, gapY:345, baseY:345, gap:bg, baseGap:bg, passed:false, boss:true, spear:run.boss.final });
      }
    } else if(stageClearT <= 0 && (!last || last.x < W - (mode==='rl' && run.path === 2 ? 193 : 240))){
      if(mode==='rl' && run.stage >= 2 && Math.random() < Math.min(0.12 + run.stage*0.04, 0.35)){
        pipes.push({ x:W+40, gapY:rand(150, GROUND_Y-150), gap:pipeGap()+40, passed:false, spear:true });
      } else if(mode==='rl' && run.stage >= 3 && Math.random() < Math.min(0.02 + run.stage*0.03, 0.35)){
        const hg = pipeGap()+40;
        pipes.push({ x:W+40, gapY:rand(150, GROUND_Y-150), gap:hg, baseGap:hg, passed:false, hammer:true, phase:rand(0,TAU), spd:rand(1.4,2.2) });
      } else if(t >= nextMoverAt){
        nextMoverAt = t + rand(10,15);
        const amp = rand(28,42), base = rand(150+amp, GROUND_Y-150-amp);
        pipes.push({ x:W+40, gapY:base, base, gap:pipeGap(), passed:false, move:true, phase:rand(0,TAU), spd:rand(0.8,1.4), amp });
      } else
        pipes.push({ x:W+40, gapY:rand(150, GROUND_Y-150), gap:pipeGap(), passed:false });
    }

    for(const p of pipes) p.x -= pipeSpeed()*pw.speed*dt;
    for(const p of pipes) if(p.move) p.gapY = p.base + Math.sin(t*p.spd + p.phase)*p.amp;
    for(const p of pipes) if(p.hammer){
      p.gap = Math.max(0, p.baseGap * (0.5 + 0.5*Math.cos(t*p.spd + p.phase)));
      if(p.gap < 10 && !p.slammed && p.x < W && p.x > -80){
        p.slammed = true;
        shake = Math.max(shake, 8);
        AudioFX.boom();
      }
      if(p.gap > p.baseGap*0.5) p.slammed = false;
    }
    labyFloorY = GROUND_Y; labyCeilY = -100;
    if(run && run.boss){
      const phs = run.boss.def.phases;
      const pidx = Math.min(phs.length-1, Math.floor(run.boss.passes * phs.length / run.boss.max));
      const pph = phs[pidx];
      if(pph.pattern === 'labyrinth'){
        if(!run.boss.labyOn){ run.boss.labyT = 0; run.boss.labyOn = true; }
        run.boss.labyT += dt;
        const s = 0.5 - 0.5*Math.cos(run.boss.labyT * (pph.spd || 2.6));
        const a = pph.amp || 240;
        labyFloorY = GROUND_Y - a*s;
        labyCeilY = a*s;
      } else run.boss.labyOn = false;
    }
    for(const p of pipes) if(p.boss && run.boss){
      const b = run.boss, ph = b.def.phases;
      const idx = Math.min(ph.length-1, Math.floor(b.passes * ph.length / b.max));
      if(idx !== b.phaseIdx){
        b.phaseIdx = idx;
        p.gap = p.baseGap; p.pulseT = 0;
        flash = 0.5; shake = 12; AudioFX.scream();
        popups.push({ x:BIRD_X, y:bird.y-60, txt:T('phase') + ' ' + (idx+1) + '/' + ph.length, life:1.2, max:1.2 });
      }
      const ph2 = ph[idx];
      p.blinking = false;
      if(ph2.pattern === 'chase'){
        p.gapY += (bird.y - p.gapY) * Math.min(1, ph2.rate * dt);
      } else if(ph2.pattern === 'squeeze'){
        p.pulseT = (p.pulseT || 0) + dt;
        const s = 0.5 - 0.5*Math.cos(p.pulseT * ph2.spd);
        p.gap = Math.max(60, p.baseGap * (1 - 0.45*s));
        p.gapY = p.baseY + Math.sin(t*0.7)*30;
      } else if(ph2.pattern === 'zigzag'){
        p.pulseT = (p.pulseT || 0) + dt;
        p.gapY = p.baseY + (Math.asin(Math.sin(p.pulseT*ph2.spd)) * (2/Math.PI)) * (ph2.amp || 110);
      } else if(ph2.pattern === 'hunt'){
        p.pulseT = (p.pulseT || 0) + dt;
        p.gapY += (bird.y - p.gapY) * Math.min(1, (ph2.rate || 1.2) * dt);
        p.gapY += Math.sin(p.pulseT * (ph2.rate || 1.2) * 3) * (ph2.amp || 90) * dt;
        p.gapY = Math.max(70, Math.min(GROUND_Y - 70, p.gapY));
      } else if(ph2.pattern === 'pulse'){
        p.pulseT = (p.pulseT || 0) + dt;
        p.gap = Math.max(70, p.baseGap * (1 + 0.35*Math.sin(p.pulseT*ph2.spd)));
        p.gapY = p.baseY + Math.sin(t*0.9)*40;
      } else if(ph2.pattern === 'step'){
        if(p.stepT == null){ p.stepT = 0; p.stepFrom = p.gapY; p.stepTo = p.gapY; }
        p.stepT += dt;
        const siv = ph2.spd || 1.5, st = ph2.tele || 0.4;
        if(p.stepT >= siv){ p.stepT = 0; p.stepFrom = p.gapY; p.stepTo = rand(70, GROUND_Y-70); }
        const srem = siv - p.stepT;
        if(srem < st){ const k = 1 - srem/st; p.gapY = p.stepFrom + (p.stepTo - p.stepFrom)*k + Math.sin(t*30)*5*(1-k); }
        else p.gapY = p.stepFrom;
      } else if(ph2.pattern === 'mirror'){
        const mty = Math.max(70, Math.min(GROUND_Y - 70, GROUND_Y - bird.y));
        p.gapY += (mty - p.gapY) * Math.min(1, (ph2.rate || 1.0) * dt * 2);
      } else if(ph2.pattern === 'shrink'){
        p.pulseT = (p.pulseT || 0) + dt;
        p.gap = Math.max(70, p.baseGap * (1 - (ph2.rate || 0.06) * p.pulseT));
        p.gapY = p.baseY + Math.sin(t*0.5)*20;
      } else if(ph2.pattern === 'blink'){
        if(p.blinkT == null) p.blinkT = 0;
        p.blinkT += dt;
        const biv = ph2.spd || 1.2, bt = ph2.tele || 0.35;
        if(p.blinkT >= biv){ p.blinkT = 0; p.gapY = rand(70, GROUND_Y-70); }
        p.blinking = p.blinkT > biv - bt;
      } else if(ph2.pattern === 'drift'){
        if(p.driftDir == null) p.driftDir = Math.random() < 0.5 ? 1 : -1;
        p.gapY += p.driftDir * (ph2.spd || 60) * dt;
        if(p.gapY < 70){ p.gapY = 70; p.driftDir = 1; }
        else if(p.gapY > GROUND_Y - 70){ p.gapY = GROUND_Y - 70; p.driftDir = -1; }
      } else if(ph2.pattern === 'labyrinth'){
        p.pulseT = (p.pulseT || 0) + dt;
        p.gapY += ((labyCeilY + labyFloorY)/2 - p.gapY) * Math.min(1, dt*2.5);
        p.gap = Math.max(70, p.baseGap * (1 + 0.3*Math.sin(p.pulseT*(ph2.bspd || 1.7))));
      } else {
        p.gapY = p.baseY + (ph2.amp ? Math.sin(t*(ph2.spd || 2.2))*ph2.amp : 0);
      }
    }
    const mag = (mode==='rl' && run ? run.upgrades.filter(u=>u==='magnet').length : 0) + pw.magnet + (hasRelic('anchor') ? 2 : 0);
    if(mag) for(const p of pipes){
      if(p.boss) continue;
      const rate = Math.min(0.3*mag, 0.9);
      if(p.move) p.base += (bird.y - p.base)*rate*dt;
      else p.gapY += (bird.y - p.gapY)*rate*dt;
    }
    while(pipes.length && pipes[0].x < -90) pipes.shift();

   // stage progression (roguelike)
    if(mode==='rl' && !run.boss && run.pipesInStage >= 15 && stageClearT <= 0){
      run.pipesInStage = 0;
      run.gold += 10;
      stageClearT = 1.2;
      pipes = [];
      flash = 0.4;
      popups.push({ x:BIRD_X, y:bird.y-50, txt:T('stageExcl').replace('{n}', run.stage), life:1.2, max:1.2 });
      AudioFX.unlock();
      refreshRlHud();
    }

    // scoring + near-miss combo
    let scored = false;
    for(const p of pipes){
      if(!p.passed && p.x + 70 < BIRD_X && rebornT <= 0){
        p.passed = true;
       if(p.boss){
          run.boss.passes++;
          const def = run.boss.def;
          if(run.boss.passes >= run.boss.max){
                const isFinal = run.boss.final;
                const isElite = run.boss.elite;
                const isLaby = run.boss.labyrinth;
                run.boss = null;
                flash = 0.5;
                AudioFX.unlock();
               if(isFinal){
                  showVictory();
                } else if(isElite || isLaby){
                  const gold = isLaby ? 25 : 20;
                  run.gold += gold;
                  const pool = isLaby ? RELICS2 : relicPool();
                  const missing = pool.filter(x => !run.relics.includes(x.id));
                  const r = missing.length ? missing[Math.floor(Math.random()*missing.length)] : null;
                  if(r) gainRelic(r.id); else run.gold += 15;
                  stageClearT = 1.5;
                   pipes = [];
                  popups.push({ x:BIRD_X, y:bird.y-50, txt:def.name + ' DEFEATED! +' + gold + 'g', life:1.5, max:1.5 });
                  popups.push({ x:BIRD_X, y:bird.y-76, txt: r ? (r.icon||'') + ' ' + r.name + '!' : '+15 gold', life:1.5, max:1.5 });
                  refreshRlHud();
                } else {
                  const pool = LEGENDS.filter(l => !run.legends.includes(l.id));
                  if(Math.random() < 0.2 && pool.length){
                    const l = pool[Math.floor(Math.random()*pool.length)];
                    run.legends.push(l.id);
                    showReveal(l.icon, legendInfo(l.id).name, legendInfo(l.id).desc, true);
                    AudioFX.legendary();
                  } else {
                    const gold = 25 + Math.floor(Math.random()*21);
                    run.gold += gold;
                    showReveal('🪙', '+' + gold + ' GOLD', '', false);
                    AudioFX.reveal();
                  }
                  stageClearT = 1.5;
                   pipes = [];
                  popups.push({ x:BIRD_X, y:bird.y-50, txt:def.name + ' DEFEATED!', life:1.5, max:1.5 });
                  refreshRlHud();
                }
             } else {
            popups.push({ x:p.x+35, y:p.gapY, txt:T('pass') + ' ' + run.boss.passes + '/' + run.boss.max, life:0.8, max:0.8 });
            AudioFX.score();
          }
          continue;
        }
        scored = true;
        const topEdge = p.gapY - p.gap/2, botEdge = p.gapY + p.gap/2;
        const clearance = Math.min(bird.y - topEdge, botEdge - bird.y) - pw.radius;
        const near = clearance < 14;
        combo = near ? combo + 1 : 0;
        const mult = Math.min(combo + 1, 4);
        const gained = (pw.mult + (pw.bonus||0)) * mult * (feverT > 0 ? 2 : 1);
        score += gained; save.total += gained;
        if(mode==='classic' && score >= themeNextAt){
          setTheme(randomTheme()); themeNextAt += 10;
          popups.push({ x:p.x+35, y:p.gapY-26, txt:theme.toUpperCase()+'!', life:0.9, max:0.9 });
        }
        $('#score').textContent = score;
        AudioFX.score();
        popups.push({ x:p.x+35, y:p.gapY, txt: near ? T('closeCall') + ' +' + gained : '+'+gained, life:0.7, max:0.7 });
        if(mode==='rl'){
          run.pipesInStage++; run.totalPipes++;
          run.gold += 1 + 2*run.upgrades.filter(u=>u==='greed').length + (near ? 2 : 0) + (hasRelic('coin') ? 1 : 0) + (near && hasRelic('echo') ? 3 : 0);
          const vampMax = run.upgrades.filter(x => x === 'vampire').length;
          if(near && run.vampUsed < vampMax && run.hp < mods().maxHp){
            run.vampUsed++; run.hp++;
            popups.push({ x:p.x+35, y:p.gapY-26, txt:T('plusHp'), life:0.7, max:0.7 });
          }
          if(near && hasLegend('bloodpact') && run.bloodUsed < 1 && run.hp < mods().maxHp){
            run.bloodUsed++;
            run.hp = Math.min(run.hp + 2, mods().maxHp);
            run.gold = Math.max(0, run.gold - 5);
            popups.push({ x:p.x+35, y:p.gapY-40, txt: lang === 'pt' ? '🩸 +2 PV -5g' : '🩸 +2 HP -5g', life:0.7, max:0.7 });
          }
          if(hasLegend('phaseshift')){
            run.phaseCount++;
            if(run.phaseCount >= 20){
              run.phaseCount = 0;
              invuln = Math.max(invuln, 3);
              popups.push({ x:p.x+35, y:p.gapY-52, txt:'🌀 PHASE SHIFT!', life:1.0, max:1.0 });
              AudioFX.reveal();
            }
          }
          refreshRlHud();
        }
        for(let i=0;i<10;i++) particles.push({
          x:p.x+35, y:p.gapY, vx:rand(-90,90), vy:rand(-140,60),
          life:rand(0.3,0.6), max:0.6, size:rand(2,4), color:'#ffd93b'
        });
        checkUnlocks();
      }
    }
    if(scored && score >= feverNextAt){
      feverNextAt += hasRelic('void') ? Math.min(15, mods().feverEvery) : mods().feverEvery;
      feverT = (hasRelic('golden') ? 15 : 10) * (hasUpgrade('storm') ? 2 : 1); flash = 0.5;
      AudioFX.startMusic(AudioFX.randomFever());
      popups.push({ x:BIRD_X, y:bird.y-50, txt:T('fever'), life:1.0, max:1.0 });
    }
    // collision (circle vs rects)
    if(rebornT <= 0 && invuln <= 0){
      for(const p of pipes){
        if(p.hit) continue;
        const topH = p.gapY - p.gap/2, botY = p.gapY + p.gap/2;
        const cTop = Math.max(0, labyCeilY), cBot = Math.min(GROUND_Y, labyFloorY);
        if(circleRect(BIRD_X, bird.y, pw.radius, p.x, cTop, 70, Math.max(0, topH - cTop)) ||
           circleRect(BIRD_X, bird.y, pw.radius, p.x, botY, 70, Math.max(0, cBot - botY))){
          if(shield > 0){
            shield--; invuln = 1.5; flash = 0.6;
            pipes.splice(pipes.indexOf(p), 1);
            popups.push({ x:BIRD_X, y:bird.y-34, txt:T('shieldTxt'), life:0.8, max:0.8 });
            AudioFX.score();
            refreshPowerTag();
            refreshRlHud();
          } else if(revive > 0){
            revive--; rebornT = 1.1;
            bird.vy = -180;
            flash = 1; shake = 8;
            popups.push({ x:BIRD_X, y:bird.y-34, txt:T('rebornTxt'), life:1.1, max:1.1 });
            AudioFX.hit(); AudioFX.die();
            refreshPowerTag();
          } else if(mode === 'rl' && run){
            const dmg = p.spear ? 2 : 1;
            run.hp -= dmg;
            if(run.hp <= 0){
              die();
            } else {
              invuln = 2; bird.vy = -250;
              flash = 0.6; shake = 8;
              p.hit = true;
              popups.push({ x:BIRD_X, y:bird.y-34, txt:T('minusHp').replace('{n}', dmg), life:0.8, max:0.8 });
              AudioFX.hit();
              refreshRlHud();
            }
          } else {
            die();
          }
          break;
        }
      }
    }
    if(bird.y + pw.radius >= labyFloorY){ bird.y = labyFloorY - pw.radius; if(pw.god){ invuln = 1.5; bird.vy = -300; } else if(rebornT <= 0) die(); }
    if(bird.y - pw.radius < labyCeilY){ bird.y = labyCeilY + pw.radius; if(pw.god){ invuln = 1.5; bird.vy = 300; } else if(rebornT <= 0) die(); }
    else if(bird.y - pw.radius < 0){ bird.y = pw.radius; bird.vy = 0; }
  }
  else if(state === 'dead'){
    labyFloorY = GROUND_Y; labyCeilY = -100;
    bird.vy = Math.min(700, bird.vy + 1400*pw.grav*dt);
    bird.y += bird.vy*dt;
    bird.rot += (1.4 - bird.rot)*Math.min(1, dt*6);
    if(bird.y + BIRD_R >= GROUND_Y){ bird.y = GROUND_Y - BIRD_R; bird.vy = 0; }
    deathTimer += dt;
    if(deathTimer > 0.7 && !overShown) showGameover();
  }

  // music varies during the run (faster switches during fever, from the fever pool)
  if((state==='ready'||state==='play') && t >= nextMusicSwitch){
    const pool = feverT > 0 ? AudioFX.FEVER_POOL : AudioFX.POOL;
    nextMusicSwitch = t + (feverT > 0 ? rand(6,10) : rand(25,40));
    let next = pool[Math.floor(Math.random()*pool.length)];
    while(next === AudioFX.mode) next = pool[Math.floor(Math.random()*pool.length)];
    AudioFX.startMusic(next);
  }
 }

function circleRect(cx, cy, r, rx, ry, rw, rh){
  const nx = clamp(cx, rx, rx+rw), ny = clamp(cy, ry, ry+rh);
  const dx = cx-nx, dy = cy-ny;
  return dx*dx + dy*dy < r*r;
}

/* ================= render ================= */
function render(){
  const nf = nightFactor();
  ctx.save();
  if(shake > 0) ctx.translate(rand(-shake,shake)*0.5, rand(-shake,shake)*0.5);

  // sky
  const dayT = (t % DAY_LEN) / DAY_LEN;
  const warm = Math.exp(-Math.pow((nf-0.5)/0.28, 2)); // dawn/dusk glow
  const th = THEMES[theme];
  const top = th.skyTop[0].map((c,i) => lerp(c, th.skyTop[1][i], nf));
  const bot = th.skyBot[0].map((c,i) => lerp(c, th.skyBot[1][i], nf));
  const g = ctx.createLinearGradient(0,0,0,GROUND_Y);
  g.addColorStop(0, `rgb(${top.map(Math.round)})`);
  g.addColorStop(1, `rgb(${bot.map(Math.round)})`);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // dawn/dusk warm overlay
  if(warm > 0.05){
    const wg = ctx.createLinearGradient(0,GROUND_Y*0.3,0,GROUND_Y);
    wg.addColorStop(0,'rgba(255,140,60,0)');
    wg.addColorStop(1,`rgba(255,140,60,${warm*0.35})`);
    ctx.fillStyle = wg; ctx.fillRect(0,0,W,GROUND_Y);
  }

  // stars
  if(nf > 0.15){
    for(const s of stars){
      const a = clamp((nf-0.15)/0.5) * (0.5 + 0.5*Math.sin(t*2.5 + s.tw));
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
  }

  // sun / moon
  const dayHalf = dayT < 0.5;
  const p = dayHalf ? dayT/0.5 : (dayT-0.5)/0.5;
  const cx2 = lerp(-40, W+40, p);
  const cy2 = H*0.72 - Math.sin(p*Math.PI)*H*0.52;
  const sunA = clamp(1-nf*2, 0, 1), moonA = clamp(nf*2-1, 0, 1);
  if(sunA > 0){
    ctx.save(); ctx.globalAlpha = sunA;
    ctx.shadowColor = 'rgba(255,220,90,0.9)'; ctx.shadowBlur = 40;
    ctx.fillStyle = '#ffe27a';
    ctx.beginPath(); ctx.arc(cx2, cy2, 34, 0, TAU); ctx.fill();
    ctx.restore();
  }
  if(moonA > 0){
    ctx.save(); ctx.globalAlpha = moonA;
    ctx.shadowColor = 'rgba(220,230,255,0.8)'; ctx.shadowBlur = 30;
    ctx.fillStyle = '#f4f7ff';
    ctx.beginPath(); ctx.arc(cx2, cy2, 28, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(180,190,215,0.5)';
    ctx.beginPath(); ctx.arc(cx2-8, cy2-6, 6, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(cx2+9, cy2+8, 4, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // clouds
  for(const c of clouds){
    ctx.fillStyle = `rgba(255,255,255,${lerp(0.85,0.22,nf)})`;
    const s = c.s;
    ctx.beginPath();
    ctx.arc(c.x, c.y, 22*s, 0, TAU);
    ctx.arc(c.x+24*s, c.y-10*s, 20*s, 0, TAU);
    ctx.arc(c.x+48*s, c.y, 22*s, 0, TAU);
    ctx.arc(c.x+24*s, c.y+8*s, 20*s, 0, TAU);
    ctx.fill();
  }

  // silhouettes
  const off = (t*12) % silW;
  ctx.save();
  ctx.translate(-off, 0);
  for(const s of silhouettes){
    for(const rep of [0, silW]){
      const sx = s.x + rep;
      if(sx > W || sx + s.w < 0) continue;
      drawSilhouette(s, nf);
    }
  }
  ctx.restore();

  // ocean band
  if(theme === 'ocean'){
    const f = lerp(1, 0.5, nf);
    ctx.fillStyle = `rgb(${Math.round(45*f)},${Math.round(140*f)},${Math.round(175*f)})`;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    for(let x=0; x<=W; x+=8) ctx.lineTo(x, GROUND_Y - 34 + Math.sin(x*0.05 + t*2)*5);
    ctx.lineTo(W, GROUND_Y); ctx.closePath(); ctx.fill();
  }

  // pipes
  let fogOn = false;
  if(run && run.boss){
    const fphs = run.boss.def.phases;
    const fidx = Math.min(fphs.length-1, Math.floor(run.boss.passes * fphs.length / run.boss.max));
    fogOn = !!fphs[fidx].fog;
  }
  for(const p of pipes){
    if(run && run.boss && p.blinking) ctx.globalAlpha = 0.4 + 0.6*Math.abs(Math.sin(t*25));
    else if(fogOn && p.x > BIRD_X + 300) ctx.globalAlpha = 0.25;
    drawPipe(p, nf);
    ctx.globalAlpha = 1;
  }

  // ground
  drawGround(nf);
  drawCeiling(nf);

  // fireflies (night, city/forest)
  if((theme==='city'||theme==='forest') && nf > 0.4){
    const a = clamp((nf-0.4)/0.5);
    for(const f of fireflies){
      const gl = 0.5+0.5*Math.sin(f.p*3);
      ctx.fillStyle = `rgba(220,255,140,${a*gl*0.9})`;
      ctx.beginPath(); ctx.arc(f.x, f.y, 2.4, 0, TAU); ctx.fill();
    }
  }

  // theme particles
  if(theme === 'snow'){
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for(const s of fxParts){ ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, TAU); ctx.fill(); }
  } else if(theme === 'desert'){
    ctx.fillStyle = 'rgba(232,204,140,0.5)';
    for(const d of fxParts) ctx.fillRect(d.x, d.y, 3, 2);
  }

  // trail
  const s = skinById(save.selected);
  for(const tr of trail){
    const a = tr.life/tr.max;
    if(s.rainbow){ ctx.fillStyle = `hsla(${(t*140 + tr.x*2)%360},90%,65%,${a*0.5})`; }
    else { ctx.globalAlpha = a*0.45; ctx.fillStyle = s.trail; }
    ctx.beginPath(); ctx.arc(tr.x, tr.y, 10*a, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // particles
  for(const p of particles){
    ctx.globalAlpha = clamp(p.life/p.max, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // bird
  if(invuln > 0) ctx.globalAlpha = Math.sin(t*30) > 0 ? 1 : 0.35;
  drawBird(BIRD_X, bird.y, bird.rot, s, bird.wing, powers().radius/BIRD_R);
  ctx.globalAlpha = 1;

  // popups
  ctx.font = '900 26px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  for(const p of popups){
    ctx.globalAlpha = clamp(p.life/p.max, 0, 1);
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 4;
    ctx.strokeText(p.txt, p.x, p.y);
    ctx.fillText(p.txt, p.x, p.y);
  }
  ctx.globalAlpha = 1;

  // GAPLORD boss bar
  if(mode==='rl' && run && run.boss && (state==='play' || state==='ready')){
    const bx = W/2 - 110, by = 14, bw = 220, bh = 14;
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(bx-8, by-22, bw+16, 40);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center';
    const b = run.boss, phN = b.def.phases.length;
    const phIdx = Math.min(phN-1, Math.floor(b.passes * phN / b.max));
    ctx.fillText(b.def.name + (phN > 1 ? '  ' + T('phase') + ' ' + (phIdx+1) + '/' + phN : ''), W/2, by-6);
    ctx.fillStyle = '#3a1020'; ctx.fillRect(bx, by, bw, bh);
    const hpFrac = (run.boss.max - run.boss.passes) / run.boss.max;
    ctx.fillStyle = '#e23b5a'; ctx.fillRect(bx, by, bw*hpFrac, bh);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
    for(let i=1;i<run.boss.max;i++){ ctx.beginPath(); ctx.moveTo(bx+bw*i/run.boss.max, by); ctx.lineTo(bx+bw*i/run.boss.max, by+bh); ctx.stroke(); }
  }

  // hit flash
  if(flash > 0){ ctx.fillStyle = `rgba(255,255,255,${flash*0.7})`; ctx.fillRect(0,0,W,H); }

  // fever tint
  if(feverT > 0){ ctx.fillStyle = `rgba(255,90,0,${0.12 + 0.08*Math.sin(t*12)})`; ctx.fillRect(0,0,W,H); }

  // vignette
  const vg = ctx.createRadialGradient(W/2, H/2, H*0.35, W/2, H/2, H*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,`rgba(0,0,0,${0.12 + nf*0.18})`);
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);

  ctx.restore();
}

function drawPipe(p, nf){
  const f = lerp(1, 0.45, nf);
  const topH = p.gapY - p.gap/2, botY = p.gapY + p.gap/2;
  let body, dark, light;
  if(p.boss){
    const c = (run.boss && run.boss.def.colors) ? run.boss.def.colors : [150,45,80, 90,20,50, 210,80,120];
    body = `rgb(${Math.round(c[0]*f)},${Math.round(c[1]*f)},${Math.round(c[2]*f)})`;
    dark = `rgb(${Math.round(c[3]*f)},${Math.round(c[4]*f)},${Math.round(c[5]*f)})`;
    light = `rgb(${Math.round(c[6]*f)},${Math.round(c[7]*f)},${Math.round(c[8]*f)})`;
  } else if(p.move){
    body = `rgb(${Math.round(235*f)},${Math.round(165*f)},${Math.round(65*f)})`;
    dark = `rgb(${Math.round(165*f)},${Math.round(105*f)},${Math.round(35*f)})`;
    light = `rgb(${Math.round(255*f)},${Math.round(210*f)},${Math.round(115*f)})`;
  } else if(p.hammer){
    body = `rgb(${Math.round(190*f)},${Math.round(75*f)},${Math.round(75*f)})`;
    dark = `rgb(${Math.round(130*f)},${Math.round(45*f)},${Math.round(45*f)})`;
    light = `rgb(${Math.round(235*f)},${Math.round(130*f)},${Math.round(110*f)})`;
  } else if(p.spear){
    body = `rgb(${Math.round(150*f)},${Math.round(160*f)},${Math.round(175*f)})`;
    dark = `rgb(${Math.round(95*f)},${Math.round(105*f)},${Math.round(125*f)})`;
    light = `rgb(${Math.round(205*f)},${Math.round(215*f)},${Math.round(230*f)})`;
  } else {
    body = `rgb(${Math.round(80*f)},${Math.round(190*f)},${Math.round(90*f)})`;
    dark = `rgb(${Math.round(50*f)},${Math.round(140*f)},${Math.round(60*f)})`;
    light = `rgb(${Math.round(140*f)},${Math.round(225*f)},${Math.round(130*f)})`;
  }
  const cTop = Math.max(0, labyCeilY), cBot = Math.min(GROUND_Y, labyFloorY);
  pipeRect(p.x, cTop, Math.max(0, topH - cTop), body, dark, light, true);
  pipeRect(p.x, botY, Math.max(0, cBot - botY), body, dark, light, false);
  if(p.move){
    const up = Math.cos(t*p.spd + p.phase) < 0;
    chevron(p.x+35, topH-13, up);
    chevron(p.x+35, botY+13, up);
  } else if(p.hammer){
    const danger = p.baseGap ? 1 - p.gap/p.baseGap : 0;
    ctx.save();
    ctx.shadowColor = 'rgba(255,60,40,0.9)';
    ctx.shadowBlur = 4 + danger*16;
    ctx.fillStyle = `rgba(255,${Math.round(110-70*danger)},40,${0.5+0.5*danger})`;
    ctx.fillRect(p.x-4, topH-3, 78, 3);
    ctx.fillRect(p.x-4, botY, 78, 3);
    ctx.restore();
    ctx.fillStyle = `rgba(50,8,8,${0.45+0.55*danger})`;
    for(let sx = p.x+6; sx + 12 <= p.x+70; sx += 12){
      ctx.beginPath(); ctx.moveTo(sx, topH); ctx.lineTo(sx+6, topH+10); ctx.lineTo(sx+12, topH); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(sx, botY); ctx.lineTo(sx+6, botY-10); ctx.lineTo(sx+12, botY); ctx.closePath(); ctx.fill();
    }
  } else if(p.spear){
    ctx.fillStyle = `rgb(${Math.round(230*f)},${Math.round(70*f)},${Math.round(70*f)})`;
    for(let sx = p.x+6; sx + 14 <= p.x+70; sx += 14){
      ctx.beginPath(); ctx.moveTo(sx, topH); ctx.lineTo(sx+7, topH+13); ctx.lineTo(sx+14, topH); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(sx, botY); ctx.lineTo(sx+7, botY-13); ctx.lineTo(sx+14, botY); ctx.closePath(); ctx.fill();
    }
  } else if(p.boss){
    const ec = (run.boss && run.boss.def.eye) || '#ff8090';
    ctx.save();
    ctx.shadowColor = ec; ctx.shadowBlur = 10;
    ctx.fillStyle = ec;
    ctx.beginPath(); ctx.arc(p.x+35, topH-10, 5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(p.x+35, botY+10, 5, 0, TAU); ctx.fill();
    ctx.restore();
  }
}
function chevron(x, y, up){
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.beginPath();
  if(up){ ctx.moveTo(x, y-5); ctx.lineTo(x-7, y+4); ctx.lineTo(x+7, y+4); }
  else { ctx.moveTo(x, y+5); ctx.lineTo(x-7, y-4); ctx.lineTo(x+7, y-4); }
  ctx.closePath(); ctx.fill();
}
function pipeRect(x, y, h, body, dark, light, isTop){
  if(h <= 0) return;
  const g = ctx.createLinearGradient(x, 0, x+70, 0);
  g.addColorStop(0, dark); g.addColorStop(0.35, light); g.addColorStop(1, dark);
  ctx.fillStyle = g;
  ctx.fillRect(x, y, 70, h);
  // cap
  const capY = isTop ? y+h-26 : y;
  const cg = ctx.createLinearGradient(x-4, 0, x+74, 0);
  cg.addColorStop(0, dark); cg.addColorStop(0.35, light); cg.addColorStop(1, dark);
  ctx.fillStyle = cg;
  ctx.fillRect(x-4, capY, 78, 26);
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 2;
  ctx.strokeRect(x-4, capY, 78, 26);
  ctx.strokeRect(x, y, 70, h);
}

function drawSilhouette(s, nf){
  const f = lerp(1, 0.45, nf);
  if(s.kind === 'dune'){
    ctx.fillStyle = `rgb(${Math.round(214*f)},${Math.round(176*f)},${Math.round(105*f)})`;
    ctx.beginPath(); ctx.ellipse(s.x + s.w/2, GROUND_Y + s.h*0.35, s.w/2, s.h, 0, Math.PI, 0); ctx.fill();
  } else if(s.kind === 'cactus'){
    ctx.fillStyle = `rgb(${Math.round(60*f)},${Math.round(120*f)},${Math.round(70*f)})`;
    ctx.fillRect(s.x, GROUND_Y - s.h, s.w*0.4, s.h);
    ctx.fillRect(s.x - s.w*0.3, GROUND_Y - s.h*0.75, s.w*0.3, s.h*0.25);
    ctx.fillRect(s.x - s.w*0.3, GROUND_Y - s.h*0.75, s.w*0.15, -s.h*0.35);
  } else if(s.kind === 'tree'){
    ctx.fillStyle = `rgb(${Math.round(46*f)},${Math.round(110*f)},${Math.round(58*f)})`;
    ctx.fillRect(s.x + s.w*0.4, GROUND_Y - s.h*0.5, s.w*0.2, s.h*0.5);
    ctx.beginPath();
    ctx.arc(s.x + s.w/2, GROUND_Y - s.h*0.55, s.w*0.5*s.r, 0, TAU);
    ctx.arc(s.x + s.w*0.15, GROUND_Y - s.h*0.3, s.w*0.4*s.r, 0, TAU);
    ctx.arc(s.x + s.w*0.85, GROUND_Y - s.h*0.3, s.w*0.4*s.r, 0, TAU);
    ctx.fill();
  } else if(s.kind === 'hill'){
    ctx.fillStyle = `rgb(${Math.round(240*f)},${Math.round(245*f)},${Math.round(252*f)})`;
    ctx.beginPath(); ctx.ellipse(s.x + s.w/2, GROUND_Y + s.h*0.4, s.w/2, s.h, 0, Math.PI, 0); ctx.fill();
  } else if(s.kind === 'island'){
    ctx.fillStyle = `rgb(${Math.round(40*f)},${Math.round(90*f)},${Math.round(100*f)})`;
    ctx.beginPath(); ctx.ellipse(s.x + s.w/2, GROUND_Y + s.h*0.5, s.w/2, s.h, 0, Math.PI, 0); ctx.fill();
  } else {
    ctx.fillStyle = `rgb(${Math.round(lerp(120,16,nf))},${Math.round(lerp(160,22,nf))},${Math.round(lerp(190,48,nf))})`;
    ctx.fillRect(s.x, GROUND_Y - s.h, s.w, s.h);
    if(nf > 0.3){
      ctx.fillStyle = `rgba(255,214,120,${clamp((nf-0.3)/0.5)*0.9})`;
      for(const w of s.wins) ctx.fillRect(s.x+w.x, GROUND_Y-s.h+w.y, 6, 9);
    }
  }
}

function drawGround(nf){
  const f = lerp(1, 0.5, nf);
  const g = THEMES[theme].ground;
  const gy = labyFloorY;
  ctx.fillStyle = `rgb(${g[0].map(c=>Math.round(c*f))})`;
  ctx.fillRect(0, gy, W, H - gy);
  ctx.fillStyle = `rgb(${g[1].map(c=>Math.round(c*f))})`;
  ctx.fillRect(0, gy, W, 22);
  // moving stripes
  ctx.fillStyle = `rgba(0,0,0,${0.10 + nf*0.1})`;
  for(let x = -48 + (48 - groundX); x < W; x += 48){
    ctx.beginPath();
    ctx.moveTo(x, gy); ctx.lineTo(x+24, gy);
    ctx.lineTo(x+12, gy+22); ctx.lineTo(x-12, gy+22);
    ctx.fill();
  }
  ctx.fillStyle = `rgba(0,0,0,${0.15 + nf*0.15})`;
  ctx.fillRect(0, gy+22, W, 4);
}

function drawCeiling(nf){
  if(labyCeilY <= 0) return;
  const f = lerp(1, 0.5, nf);
  const g = THEMES[theme].ground;
  ctx.fillStyle = `rgb(${g[0].map(c=>Math.round(c*f))})`;
  ctx.fillRect(0, 0, W, labyCeilY);
  ctx.fillStyle = `rgb(${g[1].map(c=>Math.round(c*f))})`;
  ctx.fillRect(0, labyCeilY - 22, W, 22);
  ctx.fillStyle = `rgba(0,0,0,${0.15 + nf*0.15})`;
  ctx.fillRect(0, labyCeilY - 26, W, 4);
}

function drawGlint(c, x, y, r){
  c.save();
  c.strokeStyle = 'rgba(255,255,255,0.95)';
  c.lineWidth = 1.5;
  c.beginPath();
  c.moveTo(x-r, y); c.lineTo(x+r, y);
  c.moveTo(x, y-r); c.lineTo(x, y+r);
  c.stroke();
  c.restore();
}

function drawBirdBody(c, s, wing, time, shieldOn){
  const bodyC = s.rainbow ? `hsl(${(time*140)%360},85%,60%)` : s.body;
  const wingC = s.rainbow ? `hsl(${(time*140+40)%360},85%,45%)` : s.wing;

  // ---- behind-body decor ----
  if(s.id === 'violet'){
    c.save();
    c.rotate(time*0.8);
    c.strokeStyle = 'rgba(179,136,255,0.85)'; c.lineWidth = 2;
    c.setLineDash([6,5]);
    c.beginPath(); c.arc(0,0,24,0,TAU); c.stroke();
    c.setLineDash([]);
    c.strokeStyle = 'rgba(255,255,255,0.9)';
    c.beginPath(); c.moveTo(0,0); c.lineTo(0,-21); c.stroke();
    c.restore();
  }
  if(s.id === 'rainbow'){
    for(let i=0;i<5;i++){
      c.strokeStyle = `hsla(${i*70},90%,60%,0.55)`;
      c.lineWidth = 3;
      c.beginPath(); c.arc(0,0,19.5+i*2, Math.PI*0.5, Math.PI*1.5); c.stroke();
    }
  }
  if(s.id === 'phantom'){
    c.save();
    for(let i=1;i<=2;i++){
      c.globalAlpha = 0.45 - i*0.15;
      c.fillStyle = s.body;
      c.beginPath(); c.arc(-21-i*4, Math.sin(time*4+i)*3, 5-i*1.5, 0, TAU); c.fill();
    }
    c.restore();
  }
  if(s.id === 'azure'){
    c.save();
    c.strokeStyle = 'rgba(79,195,247,0.8)'; c.lineWidth = 2;
    for(let i=0;i<3;i++){
      c.globalAlpha = 0.3 + i*0.2;
      const len = 4 + ((time*90 + i*9) % 7);
      c.beginPath(); c.moveTo(-20, -6+i*6); c.lineTo(-20-len, -6+i*6); c.stroke();
    }
    c.restore();
  }
  if(s.id === 'cat'){
    c.save();
    c.strokeStyle = s.wing; c.lineWidth = 5; c.lineCap = 'round';
    c.beginPath();
    c.moveTo(-15, 3);
    c.quadraticCurveTo(-28, 4 + Math.sin(time*3)*3, -31, -12 + Math.sin(time*2.5)*4);
    c.stroke();
    c.restore();
  }
  if(s.id === 'jade' && shieldOn){
    const r = 25 + Math.sin(time*4)*1.5;
    c.strokeStyle = 'rgba(95,224,122,0.9)'; c.lineWidth = 2.5;
    c.beginPath(); c.arc(0,0,r,0,TAU); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,0.7)'; c.lineWidth = 1.5;
    c.beginPath(); c.arc(0,0,r-3,-2.4,-0.7); c.stroke();
  }

  // ---- body ----
  c.fillStyle = bodyC;
  c.beginPath(); c.ellipse(0, 0, 18, 14, 0, 0, TAU); c.fill();
  c.fillStyle = s.belly;
  c.beginPath(); c.ellipse(2, 6, 11, 7, 0, 0, TAU); c.fill();
  c.save();
  c.translate(-6, 0); c.rotate(-0.4 + wing*1.1);
  c.fillStyle = wingC;
  if(s.id === 'demon'){
    c.beginPath();
    c.moveTo(0, -3);
    c.quadraticCurveTo(-8, -16, -17, -11);
    c.quadraticCurveTo(-11, -6, -13, -2);
    c.quadraticCurveTo(-8, -2, -9, 2);
    c.quadraticCurveTo(-4, 2, -4, 7);
    c.quadraticCurveTo(0, 4, 0, -3);
    c.closePath(); c.fill();
  } else {
    c.beginPath(); c.ellipse(0, -4, 10, 6.5, 0, 0, TAU); c.fill();
  }
  c.restore();
  // eye
  c.shadowBlur = 0;
  if(s.id === 'demon'){ c.shadowColor = 'rgba(255,40,40,0.9)'; c.shadowBlur = 8; }
  c.fillStyle = s.id === 'demon' ? '#ff5050' : '#fff';
  c.beginPath(); c.arc(8, -5, 6, 0, TAU); c.fill();
  c.fillStyle = s.id === 'phantom' ? 'rgba(40,60,80,0.9)' : (s.id === 'demon' ? '#2a0000' : '#222');
  c.beginPath(); c.arc(10, -5, 2.8, 0, TAU); c.fill();
  c.shadowBlur = 0;
  // beak
  c.fillStyle = '#ff9d3b';
  c.beginPath();
  if(s.id === 'azure'){ c.moveTo(14, 0); c.lineTo(27, 4); c.lineTo(14, 8); }
  else { c.moveTo(14, 1); c.lineTo(26, 4); c.lineTo(14, 8); }
  c.closePath(); c.fill();

  // ---- front decor ----
  if(s.id === 'crimson'){
    const f = (x, y, w, h, col) => {
      c.fillStyle = col;
      c.beginPath();
      c.moveTo(x-w, y);
      c.quadraticCurveTo(x-w*0.4, y-h*0.7, x+Math.sin(time*8+x)*1.5, y-h);
      c.quadraticCurveTo(x+w*0.4, y-h*0.7, x+w, y);
      c.closePath(); c.fill();
    };
    f(-8, -10, 4, 10, '#ff5d5d'); f(-1, -13, 4.5, 13, '#ff9d3b'); f(6, -10, 4, 10, '#ff5d5d');
    f(-1, -12, 2.5, 8, '#ffd93b');
    f(-16, -4, 4, 9, '#ff5d5d'); f(-18, 3, 3.5, 7, '#ff9d3b');
  }
  if(s.id === 'golden'){
    c.fillStyle = '#ffd700';
    c.beginPath();
    c.moveTo(-8, -12); c.lineTo(-8, -21); c.lineTo(-4, -16); c.lineTo(0, -22); c.lineTo(4, -16); c.lineTo(8, -21); c.lineTo(8, -12);
    c.closePath(); c.fill();
    c.fillStyle = '#ff3b3b';
    c.beginPath(); c.arc(0, -16, 1.8, 0, TAU); c.fill();
    for(let i=0;i<2;i++){
      const a = time*2 + i*Math.PI;
      drawGlint(c, Math.cos(a)*23, Math.sin(a)*16, 3);
    }
  }
  if(s.id === 'rainbow'){
    c.strokeStyle = 'rgba(255,255,255,0.9)'; c.lineWidth = 2.5;
    c.beginPath(); c.ellipse(0, -23, 10, 3.5, 0, 0, TAU); c.stroke();
  }
  if(s.id === 'phantom'){
    drawGlint(c, Math.sin(time*3)*6, -19, 2.5);
  }
  if(s.id === 'demon'){
    c.fillStyle = s.wing;
    c.beginPath(); c.moveTo(-6, -11); c.lineTo(-11, -22); c.lineTo(-1, -14); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(3, -13); c.lineTo(8, -24); c.lineTo(10, -12); c.closePath(); c.fill();
    c.fillStyle = '#fff';
    c.beginPath(); c.moveTo(15, 8); c.lineTo(17, 15); c.lineTo(19, 8); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(20, 8); c.lineTo(22, 14); c.lineTo(24, 8); c.closePath(); c.fill();
  }
  if(s.id === 'cat'){
    c.fillStyle = s.wing;
    c.beginPath(); c.moveTo(-13,-9); c.lineTo(-17,-25); c.lineTo(-3,-14); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(1,-13); c.lineTo(7,-26); c.lineTo(11,-11); c.closePath(); c.fill();
    c.fillStyle = '#ffb3c0';
    c.beginPath(); c.moveTo(-11,-11); c.lineTo(-14,-21); c.lineTo(-5,-13); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(2,-13); c.lineTo(5,-22); c.lineTo(8,-12); c.closePath(); c.fill();
    c.strokeStyle = 'rgba(255,255,255,0.85)'; c.lineWidth = 1;
    c.beginPath();
    c.moveTo(15,9); c.lineTo(24,7);
    c.moveTo(15,11); c.lineTo(23,13);
    c.stroke();
  }
  if(s.id === 'god'){
    c.strokeStyle = '#ffd700'; c.lineWidth = 3;
    c.beginPath(); c.ellipse(0, -26, 12, 4, 0, 0, Math.PI*2); c.stroke();
  }
}

function drawBird(x, y, rot, s, wing, scale=1){
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot); ctx.scale(scale, scale);
  if(s.ghost) ctx.globalAlpha = 0.7;
  if(rebornT > 0) ctx.globalAlpha = 0.35 + 0.25*Math.sin(t*25);
  if(s.ghost){ ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 14; }
  if(s.id === 'demon'){ ctx.shadowColor = 'rgba(255,40,40,0.7)'; ctx.shadowBlur = 12; }
  if(s.id === 'god'){ ctx.shadowColor = 'rgba(255,215,0,0.8)'; ctx.shadowBlur = 16; }
  drawBirdBody(ctx, s, wing, t, shield > 0);
  ctx.restore();
}

/* ================= UI ================= */
function show(sel, on){ $(sel).classList.toggle('hidden', !on); }

function showToast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>el.classList.add('hidden'), 2600);
}

function refreshStats(){
  $('#menuBest').textContent = mode==='rl' ? ('S'+save.rl.bestStage+' • '+save.rl.bestPipes+'p') : save.best;
  $('#menuTotal').textContent = save.total;
  $('#shopTotal').textContent = save.total;
  $('#muteBtn').textContent = save.muted ? 'OFF' : 'SND';
  const s = skinById(save.selected);
  $('#menuPower').textContent = T('power') + ': ' + (s.power ? s.powerName + ' — ' + s.powerDesc : T('none'));
}

function refreshPowerTag(){
  const s = skinById(save.selected);
  let txt = s.power ? s.powerName.toUpperCase() : T('noPower');
  if(shield > 0) txt += ' • ' + T('shieldReady');
  if(revive > 0) txt += ' • ' + T('rebornReady');
  $('#powerTag').textContent = txt;
}

function refreshComboTag(){
  const parts = [];
  if(feverT > 0) parts.push(T('fever'));
  if(combo >= 1) parts.push('x' + Math.min(combo+1,4) + ' ' + T('combo'));
  $('#comboTag').textContent = parts.join('  ');
}

const canHover = matchMedia('(hover:hover)').matches;
let tipCard = null, suppressClick = false;
const tooltip = $('#tooltip');
function showTip(card, name, desc){
  tipCard = card;
  tooltip.innerHTML = `<span class="ttName">${name.toUpperCase()}</span><br>${desc}`;
  const r = card.getBoundingClientRect();
  tooltip.style.left = clamp(r.left + r.width/2, 115, innerWidth-115) + 'px';
  tooltip.style.top = (r.top > 120 ? r.top - 8 : r.bottom + 10) + 'px';
  tooltip.classList.add('show');
}
function hideTip(){ tooltip.classList.remove('show'); tipCard = null; }

function buildShop(){
  hideTip();
  const grid = $('#skinGrid');
  grid.innerHTML = '';
  for(const s of SKINS){
    const unlocked = save.unlocked.includes(s.id);
    const card = document.createElement('div');
    card.className = 'skinCard' + (unlocked ? '' : ' locked') + (save.selected===s.id ? ' selected' : '');
    const cv = document.createElement('canvas');
    cv.width = 80; cv.height = 80;
    const c2 = cv.getContext('2d');
    c2.setTransform(1.45,0,0,1.45,40,40);
    drawBirdPreview(c2, s);
    const name = document.createElement('div'); name.className='skinName'; name.textContent = s.name;
    const pow = document.createElement('div'); pow.className='skinPower';
    pow.textContent = s.power ? s.powerName : T('noPowerDesc');
    const req = document.createElement('div'); req.className='skinReq';
    req.textContent = unlocked ? (save.selected===s.id ? T('selected') : T('tapToWear')) : T('unlockAt').replace('{n}', s.unlock);
    card.append(cv, name, pow, req);
    if(canHover){
      card.addEventListener('mouseenter', () => showTip(card, s.name, s.power ? s.powerName + ' — ' + s.powerDesc : T('noPowerDesc')));
      card.addEventListener('mouseleave', hideTip);
    } else {
      card.addEventListener('touchstart', () => {
        if(tipCard === card) hideTip();
        else { showTip(card, s); suppressClick = true; setTimeout(()=>suppressClick=false, 400); }
      }, { passive:true });
    }
    card.addEventListener('click', () => {
      if(suppressClick){ suppressClick = false; return; }
      AudioFX.init(); AudioFX.click();
      if(!unlocked){
        if(save.total >= s.unlock){ save.unlocked.push(s.id); persist(); buildShop(); }
        else { showToast(T('reachUnlock').replace('{n}', s.unlock).replace('{s}', s.name)); }
        return;
      }
      save.selected = s.id; persist();
      buildShop(); refreshStats();
    });
    grid.appendChild(card);
  }
}

function drawBirdPreview(c, s){
  c.save();
  if(s.ghost) c.globalAlpha = 0.75;
  drawBirdBody(c, s, 0.5, 0, true);
  c.restore();
}

function drawMenuBird(){
  const cv = $('#menuBird'), c2 = cv.getContext('2d');
  c2.clearRect(0,0,140,140);
  c2.save(); c2.translate(70,70); c2.scale(2.2,2.2);
  const s = skinById(save.selected);
  const wing = Math.sin(t*6)*0.5+0.5;
  if(s.ghost) c2.globalAlpha = 0.75;
  drawBirdBody(c2, s, wing, t, true);
  c2.restore();
}

/* ================= input ================= */
function primaryAction(){
  AudioFX.init();
  if(AudioFX.ctx && AudioFX.ctx.state === 'suspended') AudioFX.ctx.resume();
  if(paused) return;
  if(state === 'menu') startGame();
  else if(state === 'ready' || state === 'play') flap();
  else if(state === 'dead' && overShown) startGame();
}
document.addEventListener('pointerdown', () => AudioFX.init(), true);
canvas.addEventListener('pointerdown', e => { e.preventDefault(); primaryAction(); });
addEventListener('keydown', e => {
  if(e.code === 'Space' || e.code === 'ArrowUp'){ e.preventDefault(); primaryAction(); }
  else if(e.code === 'KeyP') togglePause();
  else if(e.code === 'KeyM') toggleMute();
  else if(e.code === 'KeyH') openHelp();
  else if(e.code === 'Escape') closeHelp();
});
function togglePause(){
  if(state !== 'play' && state !== 'ready') return;
  paused = !paused;
  show('#pauseOverlay', paused);
  $('#pauseBtn').textContent = paused ? 'GO' : 'II';
}
function toggleMute(){
  save.muted = !save.muted;
  AudioFX.muted = save.muted;
  AudioFX.applyMute();
  persist(); refreshStats();
}
$('#muteBtn').addEventListener('click', () => { AudioFX.init(); toggleMute(); });
$('#pauseBtn').addEventListener('click', () => { AudioFX.init(); togglePause(); });
function buildHelp(){
  const list = items => items.map(i=>`<p class="hint">${i.icon ? i.icon + ' ' : ''}<b>${i.name}</b> — ${i.desc}</p>`).join('');
  $('#helpBody').innerHTML =
    `<p class="hint">${T('menuHint')}</p>` +
    `<h3>${T('upgrades')}</h3>` + list(CARDS) +
    `<h3>${T('relics')}</h3>` + list(RELICS) +
    `<h3>${T('pipesH')}</h3>` +
    `<p class="hint"><b>${T('mover')}</b> — ${T('moverDesc')}</p>` +
    `<p class="hint"><b>${T('spear')}</b> — ${T('spearDesc')}</p>` +
    `<p class="hint"><b>${T('hammer')}</b> — ${T('hammerDesc')}</p>` +
    `<h3>${T('mapNodes')}</h3>` + Object.values(nodeNames()).map(v=>`<p class="hint">${v}</p>`).join('') +
    `<h3>${T('merchantH')}</h3>` +
    `<p class="hint"><b>${T('heal')}</b> — ${T('healDesc')}</p><p class="hint"><b>${T('coinOffer')}</b> — ${T('coinDesc')}</p><p class="hint"><b>${T('rerollOffer')}</b> — ${T('rerollDesc')}</p>` +
    `<h3>${T('skinPowers')}</h3>` + SKINS.filter(s=>s.power).map(s=>`<p class="hint"><b>${s.name}</b> — ${s.powerDesc}</p>`).join('') +
    `<p class="hint">${T('feverNote')}</p>`;
}
let helpOpen = false, helpWasPaused = false;
function openHelp(){
  if(helpOpen) return;
  helpOpen = true;
  helpWasPaused = paused;
  if(state==='play'||state==='ready'){ paused = true; show('#pauseOverlay', false); }
  buildHelp();
  show('#help', true);
}
function closeHelp(){
  if(!helpOpen) return;
  helpOpen = false;
  show('#help', false);
  if(state==='play'||state==='ready'){
    paused = helpWasPaused;
    show('#pauseOverlay', paused);
    $('#pauseBtn').textContent = paused ? 'GO' : 'II';
  }
}
function toMenu(){
  closeHelp();
  paused = false;
  $('#pauseBtn').textContent = 'II';
  show('#pauseOverlay', false);
  show('#hud', false);
  show('#draft', false); show('#map', false); show('#merchant', false); show('#chest', false); show('#victory', false); show('#gameover', false);
  if(mode === 'rl') resetRun();
  state = 'menu';
  AudioFX.stopMusic();
  refreshStats();
  show('#menu', true);
}
$('#pauseResume').addEventListener('click', () => { AudioFX.click(); togglePause(); });
$('#pauseHelp').addEventListener('click', () => { AudioFX.click(); openHelp(); });
$('#pauseMenu').addEventListener('click', () => { AudioFX.click(); toMenu(); });
$('#helpBtnMenu').addEventListener('click', () => { AudioFX.init(); AudioFX.click(); openHelp(); });
$('#langBtn').addEventListener('click', () => { AudioFX.init(); AudioFX.click(); lang = lang === 'en' ? 'pt' : 'en'; save.lang = lang; persist(); applyLang(); buildShop(); });
$('#helpClose').addEventListener('click', closeHelp);
 $('#revealBtn').addEventListener('click', () => { AudioFX.click(); closeReveal(); });
$('#playBtn').addEventListener('click', () => { AudioFX.init(); startGame(); });
  $('#retryBtn').addEventListener('click', () => { AudioFX.init(); startGame(); });
  $('#modeClassic').addEventListener('click', () => { AudioFX.init(); AudioFX.click(); mode = 'classic'; save.modeChosen = true; persist(); refreshMode(); });
  $('#modeRl').addEventListener('click', () => { AudioFX.init(); AudioFX.click(); mode = 'rl'; save.modeChosen = true; persist(); refreshMode(); });
  $('#merchHeal').addEventListener('click', () => {
    const p = merchPrice('heal');
    if(run.gold < p || run.hp >= mods().maxHp) return;
    run.gold -= p; run.hp++;
    AudioFX.score(); refreshMerchant(); refreshRlHud();
  });
  $('#merchShield').addEventListener('click', () => {
    const p = merchPrice('shield');
    if(run.gold < p) return;
    run.gold -= p;
    gainUpgrade('shield'); shield++;
    AudioFX.score(); refreshMerchant(); refreshRlHud();
  });
  $('#merchTough').addEventListener('click', () => {
    const p = merchPrice('tough');
    if(run.gold < p) return;
    run.gold -= p;
    gainUpgrade('tough'); run.maxHp++;
    AudioFX.score(); refreshMerchant(); refreshRlHud();
  });
  $('#merchChip').addEventListener('click', () => {
    const p = merchPrice('chip');
    if(run.gold < p) return;
    run.gold -= p;
    gainUpgrade('chip');
    AudioFX.score(); refreshMerchant(); refreshRlHud();
  });
  $('#merchCoin').addEventListener('click', () => {
    const p = merchPrice('coin');
    if(run.gold < p || luckyUsed) return;
    luckyUsed = true;
    run.gold += 35 - p;
    AudioFX.score(); refreshMerchant(); refreshRlHud();
  });
  $('#merchPhoenix').addEventListener('click', () => {
    const p = merchPrice('phoenix');
    if(run.gold < p || run.relics.includes('phoenix')) return;
    run.gold -= p;
    gainRelic('phoenix');
    AudioFX.score(); refreshMerchant(); refreshRlHud();
  });
  $('#merchAnchor').addEventListener('click', () => {
    const p = merchPrice('anchor');
    if(run.gold < p || run.relics.includes('anchor')) return;
    run.gold -= p;
    gainRelic('anchor');
    AudioFX.score(); refreshMerchant(); refreshRlHud();
  });
  $('#merchReroll').addEventListener('click', () => {
    const p = merchPrice('reroll');
    if(run.gold < p) return;
    run.gold -= p;
    pendingDraft = rollCards();
    AudioFX.click(); refreshMerchant();
  });
  $('#merchLeave').addEventListener('click', () => {
    AudioFX.click();
    show('#merchant', false);
    openDraft(pendingDraft);
  });
  $('#victoryBtn').addEventListener('click', () => {
    AudioFX.click();
    show('#victory', false);
    startGame();
  });
  $('#continueBtn').addEventListener('click', () => {
    AudioFX.click();
    show('#victory', false);
    run.path = 2;
    map = genMap(2);
    showMap();
  });
  $('#chestOpen').addEventListener('click', () => {
    if(!chestOpened){
      chestOpened = true;
      const r = chestReward;
      if(r.gold){ run.gold += r.gold; $('#chestReward').textContent = T('plusGold').replace('{n}', r.gold); }
      else if(r.relic){ const rel = RELICS.find(x => x.id === r.relic); gainRelic(r.relic); $('#chestReward').textContent = T('relicLabel') + (rel.icon||'') + ' ' + rel.name; }
      else { run.hp = Math.min(mods().maxHp, run.hp + 1); $('#chestReward').textContent = T('plusHp'); }
      AudioFX.score();
      refreshRlHud();
      $('#chestOpen').textContent = T('continue');
    } else {
      AudioFX.click();
      show('#chest', false);
      openDraft(rollCards());
    }
  });
 $('#skinsBtn').addEventListener('click', () => {
    AudioFX.init();
    AudioFX.click();
    buildShop();
    show('#shop', true);
  });
  $('#skinsBtnOver').addEventListener('click', () => {
    AudioFX.init();
    AudioFX.click();
    buildShop();
    show('#shop', true);
  });
$('#shopClose').addEventListener('click', () => { AudioFX.click(); hideTip(); show('#shop', false); });
 $('#skinGrid').addEventListener('scroll', hideTip);
document.addEventListener('visibilitychange', () => {
  if(document.hidden && state === 'play' && !paused) togglePause();
});

/* ================= main loop ================= */
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last)/1000; last = now;
  dt = Math.min(dt, 0.05);
  if(!paused) update(dt);
  render();
  if(!$('#menu').classList.contains('hidden')) drawMenuBird();
}

/* ================= boot ================= */
AudioFX.muted = save.muted;
checkI18n();
applyLang();
buildShop();
refreshStats();
refreshMode();
requestAnimationFrame(frame);
</script>
</body>
</html>
