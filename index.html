<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flappy Deluxe</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#0a0e1a; }
  body {
    display:flex; align-items:center; justify-content:center;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  #wrap { position:relative; }
  #game { display:block; border-radius:14px; box-shadow:0 25px 70px rgba(0,0,0,.65); }
  .hidden { display:none !important; }

  /* ---------- HUD ---------- */
  #hud {
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:14px 16px; pointer-events:none; z-index:5;
  }
  #score {
    font-size:46px; font-weight:900; color:#fff; letter-spacing:2px;
    text-shadow:0 3px 0 rgba(0,0,0,.4), 0 0 18px rgba(255,255,255,.25);
  }
  #powerTag {
    font-size:12px; font-weight:800; letter-spacing:1px; color:#ffd93b;
    text-shadow:0 2px 0 rgba(0,0,0,.4); margin-top:2px;
  }
  #comboTag {
    font-size:12px; font-weight:800; letter-spacing:1px; color:#ff7b3b;
    text-shadow:0 2px 0 rgba(0,0,0,.4); margin-top:2px; min-height:14px;
  }
  #rlHud {
    display:flex; gap:12px; margin-top:4px;
    font-size:15px; font-weight:900; letter-spacing:2px;
    color:#ff5d5d; text-shadow:0 2px 0 rgba(0,0,0,.4);
  }
  #rlStage { color:#fff; }
  #rlGold { color:#ffd93b; }
  #runItems { display:flex; gap:4px; flex-wrap:wrap; margin-top:4px; max-width:210px; }
  #runItems .itemIcon { font-size:15px; line-height:1; filter:drop-shadow(0 2px 0 rgba(0,0,0,.4)); display:inline-flex; flex-direction:column; align-items:center; }
  #runItems .itemBadge { font-size:8px; font-weight:bold; color:rgba(255,255,255,.7); line-height:1; }
  #merchantOffers { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  #map { overflow-y:auto; justify-content:flex-start; }
  #map .card { width:100%; max-width:440px; padding:14px 18px; gap:10px; }
  #mapBox { position:relative; width:100%; height:440px; }
  #mapBox svg { position:absolute; left:0; top:0; width:100%; height:100%; }
  .mapNode {
    position:absolute; width:40px; height:40px; border-radius:50%;
    font-size:18px; line-height:1; padding:0;
    background:rgba(0,0,0,.4); border:2px solid rgba(255,255,255,.22);
    opacity:.5; cursor:default; transition:transform .12s, opacity .12s;
  }
  .mapNode.avail { opacity:1; border-color:#ffd93b; cursor:pointer; box-shadow:0 0 14px rgba(255,217,59,.5); }
  .mapNode.avail:hover { transform:scale(1.18); }
  .mapNode.visited { opacity:.4; border-color:#7fff7f; }
  .mapStart {
    position:absolute; width:40px; height:40px; border-radius:50%;
    font-size:18px; line-height:1; background:rgba(0,0,0,.4);
    border:2px solid #4fc3f7; box-shadow:0 0 14px rgba(79,195,247,.5);
  }
  #merchantDraft { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  #merchant { overflow-y:auto; justify-content:flex-start; }
  #merchant .card { width:100%; max-width:440px; padding:14px 18px; gap:10px; }
  #merchant .draftCard { pointer-events:none; width:120px; padding:10px 8px; }
  #merchantOffers .draftCard { pointer-events:auto; }
  #merchantOffers .draftCard:disabled { opacity:.4; cursor:default; transform:none; }
  #hudBtns { display:flex; gap:8px; pointer-events:auto; }
  .iconBtn {
    width:42px; height:42px; border:none; border-radius:12px; cursor:pointer;
    background:rgba(15,20,35,.55); color:#fff; font-size:15px; font-weight:800;
    backdrop-filter:blur(6px); transition:transform .12s, background .2s;
  }
  .iconBtn:hover { transform:scale(1.08); background:rgba(15,20,35,.8); }

  #help .card { width:100%; max-width:560px; max-height:92vh; overflow-y:auto; text-align:left; }
  #help h3 { font-size:14px; letter-spacing:2px; color:#ffd93b; margin:8px 0 2px; }
  #help .hint { text-align:left; }

  /* ---------- Panels ---------- */
  .panel {
    position:absolute; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:24px; text-align:center;
  }
  .card {
    background:rgba(14,18,34,.82); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.14); border-radius:20px;
    padding:26px 30px; display:flex; flex-direction:column; align-items:center; gap:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.5);
    animation:pop .35s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes pop { from { transform:scale(.85); opacity:0; } to { transform:scale(1); opacity:1; } }
  #reveal {
    position:absolute; inset:0; z-index:12; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
  }
  #revealCard {
    background:rgba(14,18,34,.9); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.2); border-radius:20px;
    padding:26px 34px; display:flex; flex-direction:column; align-items:center; gap:10px;
    box-shadow:0 18px 50px rgba(0,0,0,.5);
    animation:revealPop 2.4s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  #revealCard.legendary { border-color:rgba(255,215,0,.55); box-shadow:0 0 40px rgba(255,215,0,.35), 0 18px 50px rgba(0,0,0,.5); }
  #revealIcon { font-size:56px; }
  #revealTitle { font-size:30px; font-weight:900; letter-spacing:2px; }
  #revealDesc { font-size:15px; opacity:.85; max-width:300px; }
  #revealBtn { pointer-events:auto; margin-top:6px; }
  @keyframes revealPop {
    0% { transform:scale(.3) rotate(-6deg); opacity:0; }
    18% { transform:scale(1.12) rotate(2deg); opacity:1; }
    30% { transform:scale(1) rotate(0); }
    78% { transform:scale(1); opacity:1; }
    100% { transform:scale(1.06); opacity:0; }
  }
  @keyframes revealHold {
    0% { transform:scale(.3) rotate(-6deg); opacity:0; }
    18% { transform:scale(1.12) rotate(2deg); opacity:1; }
    30% { transform:scale(1) rotate(0); opacity:1; }
  }

  h1 {
    font-size:46px; font-weight:900; letter-spacing:3px; line-height:1.05;
    background:linear-gradient(180deg,#fff 20%,#ffd93b 90%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 4px 0 rgba(0,0,0,.35));
  }
  h1 span { display:block; font-size:20px; letter-spacing:8px;
    background:linear-gradient(180deg,#9fd8ff,#4fc3f7); -webkit-background-clip:text; background-clip:text; }
  h2 { font-size:26px; font-weight:900; color:#fff; letter-spacing:2px; }

  .btn {
    border:none; cursor:pointer; font-family:inherit; font-weight:800; letter-spacing:2px;
    color:#fff; border-radius:14px; padding:13px 34px; font-size:17px;
    background:linear-gradient(180deg,#ffd93b,#f2a51e);
    box-shadow:0 5px 0 #a86e00, 0 10px 24px rgba(0,0,0,.4);
    transition:transform .1s, box-shadow .1s;
  }
  .btn:hover { transform:translateY(2px); box-shadow:0 3px 0 #a86e00, 0 6px 16px rgba(0,0,0,.4); }
  .btn.ghost {
    background:rgba(255,255,255,.12); box-shadow:0 4px 0 rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.25); font-size:14px; padding:11px 26px;
  }
  .modeRow { display:flex; gap:10px; }
  .modeBtn {
    padding:10px 22px; font-size:14px;
    background:rgba(255,255,255,.12); box-shadow:0 4px 0 rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.25); color:rgba(255,255,255,.6);
  }
  .modeBtn.active {
    background:linear-gradient(180deg,#ffd93b,#f2a51e);
    box-shadow:0 4px 0 #a86e00; border:none; color:#fff;
  }
  .stat { color:#cfd8ff; font-size:15px; font-weight:600; letter-spacing:1px; }
  .stat b { color:#fff; }
  .hint { color:rgba(255,255,255,.55); font-size:13px; letter-spacing:1px; }

  /* ---------- Game over ---------- */
  .scoreRow { display:flex; gap:34px; }
  .scoreRow div { display:flex; flex-direction:column; gap:4px; }
  .scoreRow span { font-size:12px; letter-spacing:2px; color:#9fb0d8; font-weight:700; }
  .scoreRow b { font-size:34px; font-weight:900; color:#fff; }
  #medalBox { display:flex; flex-direction:column; align-items:center; gap:6px; }
  #medal {
    width:74px; height:74px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:900; letter-spacing:1px; color:rgba(0,0,0,.55);
    border:3px solid rgba(255,255,255,.5);
  }
  #newRecord {
    color:#ffd93b; font-weight:900; letter-spacing:2px; font-size:15px;
    animation:pulse 1s infinite alternate;
  }
  @keyframes pulse { from { transform:scale(1); } to { transform:scale(1.12); } }

  /* ---------- Shop ---------- */
  #shop { background:rgba(5,8,18,.72); backdrop-filter:blur(6px); overflow-y:auto; justify-content:flex-start; }
   #shop .card { width:100%; max-width:520px; margin:auto 0; }
   #skinGrid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
   .skinCard {
     padding:10px 8px; border-radius:14px; cursor:pointer;
    background:rgba(255,255,255,.07); border:2px solid rgba(255,255,255,.12);
    display:flex; flex-direction:column; align-items:center; gap:6px;
    transition:transform .12s, border-color .2s, background .2s;
  }
  .skinCard:hover { transform:translateY(-3px); }
  .skinCard.selected { border-color:#ffd93b; background:rgba(255,217,59,.12); }
  .skinCard.locked { opacity:.55; }
  .skinCard canvas { border-radius:10px; background:rgba(0,0,0,.25); width:80px; height:80px; }
   @media (max-width:520px){
     #shop { padding:14px; gap:10px; }
     #shop .card { padding:16px 14px; gap:10px; }
     #shopTop { gap:10px; }
     #shopTop h2 { font-size:20px; }
     #skinGrid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
     .skinCard canvas { width:64px; height:64px; }
     .skinName { font-size:11px; }
   }
  .skinName { font-size:12px; font-weight:800; color:#fff; letter-spacing:.5px; }
  .skinReq { font-size:10px; color:#9fb0d8; font-weight:600; }
  .skinPower { font-size:9px; color:#ffd93b; font-weight:700; letter-spacing:.5px; }
  #tooltip {
    position:fixed; z-index:30; pointer-events:none;
    transform:translate(-50%,-100%);
    background:rgba(10,14,30,.95); border:2px solid rgba(255,255,255,.3);
    border-radius:10px; padding:8px 12px; text-align:center;
    font-size:12px; font-weight:700; color:#fff; max-width:210px;
    opacity:0; transition:opacity .12s;
  }
  #tooltip.show { opacity:1; }
  #tooltip .ttName { color:#ffd93b; font-size:10px; letter-spacing:1px; }
  #shopTop { display:flex; gap:18px; align-items:center; }

  /* ---------- Roguelike: draft / stats ---------- */
  #rlStats { color:#ffd93b; font-weight:900; letter-spacing:2px; font-size:15px; }
  #draft .card { width:100%; max-width:560px; }
  #draftCards { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .draftCard {
    width:150px; padding:16px 12px; cursor:pointer;
    display:flex; flex-direction:column; gap:8px; align-items:center;
    background:rgba(255,255,255,.07); border:2px solid rgba(255,255,255,.15);
    border-radius:14px; font-family:inherit;
    transition:transform .12s, border-color .2s, background .2s;
  }
  .draftCard:hover { transform:translateY(-3px); border-color:#ffd93b; background:rgba(255,217,59,.12); }
  .dcName { font-size:14px; font-weight:900; letter-spacing:1px; color:#ffd93b; text-align:center; width:100%; }
  .dcDesc { font-size:11px; font-weight:600; color:#cfd8ff; letter-spacing:.5px; text-align:center; width:100%; }
  @media (max-width:520px){
    #draftCards { flex-direction:column; align-items:center; }
    .draftCard { width:100%; max-width:260px; }
  }

  /* ---------- Toast / pause ---------- */
  #toast {
    position:absolute; top:70px; left:50%; transform:translateX(-50%);
    z-index:20; padding:10px 22px; border-radius:14px;
    background:rgba(20,26,48,.92); border:1px solid rgba(255,217,59,.6);
    color:#ffd93b; font-weight:800; font-size:14px; letter-spacing:1px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    animation:toastIn 2.6s forwards; pointer-events:none;
  }
  @keyframes toastIn {
    0% { opacity:0; transform:translate(-50%,-16px); }
    10%, 80% { opacity:1; transform:translate(-50%,0); }
    100% { opacity:0; transform:translate(-50%,-16px); }
  }
  #pauseOverlay {
    position:absolute; inset:0; z-index:15;
    display:flex; align-items:center; justify-content:center;
    background:rgba(5,8,18,.55); backdrop-filter:blur(4px);
  }
  #pauseOverlay .card { padding:22px 28px; gap:12px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div><div id="score">0</div><div id="powerTag"></div><div id="comboTag"></div><div id="rlHud" class="hidden"><span id="rlHearts"></span><span id="rlGold"></span><span id="rlStage"></span></div><div id="runItems" class="hidden"></div></div>
    <div id="hudBtns">
      <button class="iconBtn" id="muteBtn" title="Sound (M)">SND</button>
      <button class="iconBtn" id="pauseBtn" title="Pause (P)">II</button>
    </div>
  </div>

  <div id="menu" class="panel">
    <div class="card">
      <h1>FLAPPY<span>DELUXE</span></h1>
      <canvas id="menuBird" width="140" height="140"></canvas>
      <p class="stat"><span id="lblBest">BEST</span> <b id="menuBest">0</b> &nbsp;•&nbsp; <span id="lblTotal">TOTAL</span> <b id="menuTotal">0</b></p>
      <p class="hint" id="menuPower"></p>
      <div class="modeRow">
        <button class="btn modeBtn" id="modeClassic">CLASSIC</button>
        <button class="btn modeBtn" id="modeRl">ROGUELIKE</button>
      </div>
      <button class="btn" id="playBtn">PLAY</button>
      <button class="btn ghost" id="skinsBtn">SKINS</button>
      <button class="btn ghost" id="helpBtnMenu">HOW TO PLAY</button>
      <button class="btn ghost" id="langBtn">PT-BR</button>
      <p class="hint" id="menuHint">SPACE / CLICK to flap &nbsp;•&nbsp; P pause &nbsp;•&nbsp; M sound &nbsp;•&nbsp; H help</p>
    </div>
  </div>

  <div id="gameover" class="panel hidden">
    <div class="card">
      <h2 id="goTitle">GAME OVER</h2>
      <div id="medalBox"><div id="medal">—</div></div>
      <div class="scoreRow">
        <div><span id="lblScore">SCORE</span><b id="finalScore">0</b></div>
        <div><span id="lblBest2">BEST</span><b id="bestScore">0</b></div>
      </div>
      <div id="newRecord" class="hidden">NEW RECORD!</div>
      <p id="rlStats" class="hidden"></p>
      <button class="btn" id="retryBtn">PLAY AGAIN</button>
      <button class="btn ghost" id="skinsBtnOver">SKINS</button>
    </div>
  </div>

  <div id="shop" class="panel hidden">
    <div class="card" style="max-width:520px">
      <div id="shopTop">
        <h2 id="shopTitle">SKINS</h2>
        <p class="stat"><span id="lblTotal2">TOTAL</span> <b id="shopTotal">0</b> <span id="lblPts">PTS</span></p>
      </div>
      <div id="skinGrid"></div>
      <button class="btn ghost" id="shopClose">CLOSE</button>
    </div>
  </div>

  <div id="draft" class="panel hidden">
    <div class="card">
      <h2 id="draftTitle">UPGRADE</h2>
      <p class="hint" id="draftHint">Pick an upgrade</p>
      <div id="draftCards"></div>
    </div>
  </div>

  <div id="map" class="panel hidden">
    <div class="card">
      <h2 id="mapTitle">THE PATH</h2>
      <p class="hint" id="mapHint">Tap a glowing node</p>
      <div id="mapBox"></div>
    </div>
  </div>

  <div id="victory" class="panel hidden">
    <div class="card">
      <h2 id="victoryTitle">VICTORY!</h2>
      <p class="hint" id="victoryStats"></p>
      <button class="btn" id="continueBtn">CONTINUE → PATH 2</button>
      <button class="btn ghost" id="victoryBtn">PLAY AGAIN</button>
    </div>
  </div>

  <div id="chest" class="panel hidden">
    <div class="card">
      <h2 id="chestTitle">CHEST</h2>
      <p id="chestReward" class="hint">???</p>
      <button class="btn" id="chestOpen">OPEN</button>
    </div>
  </div>

  <div id="reveal" class="hidden">
    <div id="revealCard">
      <div id="revealIcon"></div>
      <div id="revealTitle"></div>
      <div id="revealDesc"></div>
      <button class="btn" id="revealBtn">INCREDIBLE!</button>
    </div>
  </div>

  <div id="merchant" class="panel hidden">
    <div class="card">
      <h2 id="merchTitle">MERCHANT</h2>
      <p id="merchantGold" class="hint"></p>
      <div id="merchantOffers">
        <button class="draftCard" id="merchHeal"><span class="dcName">Heal 1 HP</span><span class="dcDesc">15g</span></button>
        <button class="draftCard" id="merchShield"><span class="dcName">Shield</span><span class="dcDesc">+1 shield charge — 25g</span></button>
        <button class="draftCard" id="merchTough"><span class="dcName">Tough</span><span class="dcDesc">+1 max HP, heal 1 — 30g</span></button>
        <button class="draftCard" id="merchChip"><span class="dcName">Fever Chip</span><span class="dcDesc">Fever threshold -10 — 25g</span></button>
        <button class="draftCard" id="merchCoin"><span class="dcName">Lucky Coin</span><span class="dcDesc">Pay 20g, gain 35g</span></button>
        <button class="draftCard" id="merchPhoenix"><span class="dcName">Phoenix</span><span class="dcDesc">+1 revive — 40g</span></button>
        <button class="draftCard" id="merchAnchor"><span class="dcName">Anchor</span><span class="dcDesc">Base magnet 2 — 35g</span></button>
        <button class="draftCard" id="merchReroll"><span class="dcName">Reroll Draft</span><span class="dcDesc">10g</span></button>
      </div>
      <p class="hint" id="merchHint">Next draft — pick one after leaving</p>
      <div id="merchantDraft"></div>
      <button class="btn" id="merchLeave">LEAVE</button>
    </div>
  </div>

  <div id="help" class="panel hidden">
    <div class="card">
      <h2 id="helpTitle">HOW TO PLAY</h2>
      <div id="helpBody"></div>
      <button class="btn" id="helpClose">CLOSE</button>
    </div>
  </div>

  <div id="tooltip"></div>
  <div id="toast" class="hidden"></div>
  <div id="pauseOverlay" class="hidden">
    <div class="card">
      <h2 id="pauseTitle">PAUSED</h2>
      <button class="btn" id="pauseResume">RESUME</button>
      <button class="btn ghost" id="pauseHelp">HELP</button>
      <button class="btn ghost" id="pauseMenu">MAIN MENU</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;
const rand = (a,b) => a+Math.random()*(b-a);
const TAU = Math.PI*2;

/* ================= save ================= */
const SAVE_KEY = 'flappyDeluxeSave';
const defaultSave = { best:0, total:0, unlocked:['classic'], selected:'classic', muted:false, mode:'rl', modeChosen:false, lang:'en', rl:{ bestStage:0, bestPipes:0 } };
let save;
try { save = Object.assign(defaultSave, JSON.parse(localStorage.getItem(SAVE_KEY)||'{}')); }
catch(e){ save = Object.assign({}, defaultSave); }
if(!save.rl) save.rl = { bestStage:0, bestPipes:0 };
if(!save.modeChosen) save.mode = 'rl';
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }

/* ================= skins ================= */
const SKINS = [
  { id:'classic', name:'Classic', body:'#ffd93b', belly:'#fff6cf', wing:'#f2a51e', trail:'#ffe98a', unlock:0, power:null, powerName:'', powerDesc:'No power' },
  { id:'crimson', name:'Crimson', body:'#ff5d5d', belly:'#ffd9d9', wing:'#d63b3b', trail:'#ff9a9a', unlock:10, power:'feather', powerName:'Feather', powerDesc:'Lighter gravity' },
  { id:'azure',   name:'Azure',   body:'#4fc3f7', belly:'#e8f9ff', wing:'#1e93d6', trail:'#9fe0ff', unlock:25, power:'compact', powerName:'Compact', powerDesc:'Smaller hitbox' },
  { id:'jade',    name:'Jade',    body:'#5fe07a', belly:'#eaffd9', wing:'#2aa84e', trail:'#a2f5b0', unlock:50, power:'shield', powerName:'Shield', powerDesc:'4 HP + survive 1 hit per run' },
  { id:'violet',  name:'Violet',  body:'#b388ff', belly:'#f3e9ff', wing:'#8a4fd6', trail:'#d7baff', unlock:100, power:'time', powerName:'Time', powerDesc:'Pipes 20% slower' },
  { id:'golden',  name:'Golden',  body:'#ffd700', belly:'#fffbe0', wing:'#d9a400', trail:'#fff3a0', unlock:200, sparkle:true, power:'midas', powerName:'Midas', powerDesc:'Double points' },

chestReward = null;

function hasUpgrade(id){ return mode==='rl' && run && run.upgrades.includes(id); }
function hasRelic(id){ return mode==='rl' && run && run.relics.includes(id); }

function mods(){
  const pw = powers();
  const m = { grav:pw.grav, speed:pw.speed, mult:pw.mult, bonus:0, shield:pw.shield, feverEvery:30, maxHp:pw.maxHp, radius:pw.radius, magnet:pw.magnet, god:pw.god };
  if(mode === 'rl' && run){
    for(const u of run.upgrades){
      if(u==='feather') m.grav *= 0.9;
      if(u==='midas') m.bonus += 1;
      if(u==='shield') m.shield += 1;
      if(u==='chip') m.feverEvery -= 10;
      if(u==='slow') m.speed *= 0.9;
      if(u==='tough') m.maxHp += 1;
    }
    for(const r of run.relics){
      if(r==='prism') m.speed *= 0.85;
    }
    m.grav = Math.max(0.5, m.grav);
    m.speed = Math.max(0.6, m.speed);
    m.feverEvery = Math.max(10, m.feverEvery);
  }
  return m;
}

function refreshRlHud(){
  show('#rlHud', mode==='rl' && !!run);
  show('#runItems', mode==='rl' && !!run);
  if(mode !== 'rl' || !run) return;
  const maxHp = mods().maxHp;
  const heartsEl = $('#rlHearts');
  if(maxHp > 12){
    heartsEl.textContent = '♥ ' + Math.max(0, run.hp) + '/' + maxHp;
    heartsEl.style.fontSize = '';
  } else {
    heartsEl.textContent = '♥'.repeat(Math.max(0, run.hp)) + '♡'.repeat(Math.max(0, maxHp - run.hp));
    heartsEl.style.fontSize = maxHp > 9 ? '10px' : maxHp > 6 ? '12px' : '';
  }
  $('#rlGold').textContent = '🪙' + run.gold;
  $('#rlStage').textContent = T('stage') + ' ' + Math.max(1, run.stage);
  renderRunItems();
}

function renderRunItems(){
  const el = $('#runItems');
  el.innerHTML = '';
  const add = (icon, name, desc, badge) => {
    const s = document.createElement('span');
    s.className = 'itemIcon';
    s.textContent = icon;
    if(badge){ const b = document.createElement('span'); b.className = 'itemBadge'; b.textContent = badge; s.appendChild(b); }
    if(canHover){
      s.addEventListener('mouseenter', () => showTip(s, name, desc));
      s.addEventListener('mouseleave', hideTip);
    } else {
      s.addEventListener('touchstart', () => {
        if(tipCard === s) hideTip();
        else showTip(s, name, desc);
      }, { passive:true });
    }
    el.appendChild(s);
  };
  const counts = {};
  for(const u of run.upgrades) counts[u] = (counts[u]||0)+1;
  for(const id in counts){
    const c = CARDS.find(x => x.id === id);
    if(c){
      const n = id === 'shield' ? shield : counts[id];
      add(c.icon, c.name + (counts[id] > 1 ? ' ×' + counts[id] : ''), c.desc, n);
    }
  }
  for(const r of run.relics){
    const rel = RELICS.find(x => x.id === r);
    if(rel) add(rel.icon, rel.name, rel.desc);
  }
  for(const l of (run.legends || [])){
    const info = legendInfo(l);
    add(info.icon, info.name, info.desc);
  }
}

function refreshMode(){
  $('#modeClassic').classList.toggle('active', mode==='classic');
  $('#modeRl').classList.toggle('active', mode==='rl');
  const rl = mode==='rl';
  $('#skinsBtn').textContent = rl ? T('characters') : T('skins');
  $('#skinsBtnOver').textContent = rl ? T('characters') : T('skins');
  $('#shopTitle').textContent = rl ? T('characters') : T('skins');
  refreshStats();
}

function rollCards(){
  const pool = CARDS.filter(c => !c.p2 || (run && run.path === 2)).slice(), picks = [];
  while(picks.length < 3 && pool.length){
    picks.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  }
  return picks;
}

function renderCards(grid, cards, clickable){
  grid.innerHTML = '';
  for(const c of cards){
    const el = document.createElement('button');
    el.className = 'draftCard';
    el.innerHTML = `<span class="dcName">${c.icon ? c.icon + ' ' : ''}${c.name}</span><span class="dcDesc">${c.desc}</span>`;
    if(clickable) el.addEventListener('click', () => {
      const now = performance.now();
      if(now - draftGuardT < 400){ draftGuardT = now; return; }
      draftGuardT = now;
      pickCard(c.id);
    });
    else el.disabled = true;
    grid.appendChild(el);
  }
}

function openDraft(cards){
  state = 'draft';
  draftGuardT = performance.now();
  renderCards($('#draftCards'), cards || rollCards(), true);
  show('#draft', true);
}

function genMap(path){
  const cfg = PATHS[path || 1];
  const pool = (path === 2 ? BOSSES2 : BOSSES);
  const elitePool = [...ELITES].sort(() => Math.random() - 0.5);
  const labyPool = [...LABYRINTHS].sort(() => Math.random() - 0.5);
  let eI = 0, lI = 0;
  const rows = [];
  for(let r=0;r<cfg.rows;r++){
    const row = [];
    for(let i=0;i<cfg.widths[r];i++){
      let type;
      if(r === cfg.rows-1) type = 'final';
      else if(cfg.bossRows.includes(r) && Math.random() < 0.5) type = 'boss';
      if(!type){
        const roll = Math.random();
        if(cfg.widths[r] >= 2 && roll >= 0.85) type = (path === 2) ? 'labyrinth' : 'elite';
        else type = roll < 0.55 ? 'stage' : roll < 0.75 ? 'chest' : 'merchant';
      }
      row.push({ type, visited:false });
    }
    if(cfg.bossRows.includes(r) && !row.some(n => n.type === 'boss'))
      row[Math.floor(Math.random()*row.length)].type = 'boss';
    for(const n of row){
      if(n.type === 'boss') n.def = pool[Math.floor(r/4)][Math.floor(Math.random()*2)];
      else if(n.type === 'final') n.def = pool[3][Math.floor(Math.random()*2)];
      else if(n.type === 'elite') n.def = elitePool[eI++ % elitePool.length];
      else if(n.type === 'labyrinth') n.def = labyPool[lI++ % labyPool.length];
    }
    rows.push(row);
  }
  const edges = [];
  for(let r=0;r<cfg.rows-1;r++){
    const a = rows[r].length, b = rows[r+1].length;
    for(let i=0;i<a;i++)
      for(let j=0;j<b;j++) edges.push({ r, i, j });
  }
  return { rows, edges, pos:{ row:-1, idx:0 }, cfg, path: path || 1 };
}

function mapXY(r, i){
  const W = 100, H = 440, top = 30, bot = H - 30;
  const cfg = map.cfg;
  return { x:(i+0.5)/cfg.widths[r]*W, y:bot - r*(bot-top)/(cfg.rows-1) };
}

function showMap(){
  state = 'map';
  const box = $('#mapBox');
  box.innerHTML = '';
  const nextR = map.pos.row + 1;
  const avail = map.pos.row === -1
    ? map.rows[0].map((_, j) => j)
    : map.edges.filter(e => e.r === map.pos.row && e.i === map.pos.idx).map(e => e.j);
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', '0 0 100 440');
  svg.setAttribute('preserveAspectRatio', 'none');
  for(const e of map.edges){
    const a = mapXY(e.r, e.i), b = mapXY(e.r+1, e.j);
    const line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
    line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
    const active = e.r === map.pos.row && (map.pos.row === -1 || e.i === map.pos.idx);
    line.setAttribute('stroke', active ? 'rgba(255,217,59,.8)' : 'rgba(255,255,255,.18)');
    line.setAttribute('stroke-width', active ? 3 : 2);
    svg.appendChild(line);
  }
  box.appendChild(svg);
  const start = document.createElement('div');
  start.className = 'mapStart';
  start.textContent = '🐦';
  start.style.left = 'calc(50% - 20px)';
  start.style.top = (440 - 30 - 20) + 'px';
  box.appendChild(start);
  for(let r=0;r<map.cfg.rows;r++)
    for(let i=0;i<map.rows[r].length;i++){
      const n = map.rows[r][i];
      const { x, y } = mapXY(r, i);
      const el = document.createElement('button');
      el.className = 'mapNode' + (n.visited ? ' visited' : (r === nextR && avail.includes(i) ? ' avail' : ''));
      el.textContent = NODE_ICONS[n.type];

      if(r === nextR && avail.includes(i)) el.addEventListener('click', () => clickNode(r, i));
      box.appendChild(el);
    }
  show('#map', true);
}

const AudioFX = {
  ctx:null, muted:false,
  init(){
    if(this.ctx){ if(this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
    this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 0.22; this.musicGain.connect(this.master);
    this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = 0.5; this.sfxGain.connect(this.master);
    this.applyMute();
  },
  applyMute(){ if(this.master) this.master.gain.value = this.muted ? 0 : 1; },
  tone(o){
    if(!this.ctx) return;
    const { f=440, d=0.15, type='sine', v=1, slide=0, at=0, dest=null } = o;
    const t = this.ctx.currentTime + at;
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(f, t);
    if(slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, f+slide), t+d);
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+d);
    osc.connect(g); g.connect(dest || this.sfxGain);
    osc.start(t); osc.stop(t+d+0.05);
  },
  noise(o){
    if(!this.ctx) return;
    const { d=0.1, v=0.4, f=1200, q=1, at=0, dest=null } = o;
    const t = this.ctx.currentTime + at;
    const len = Math.max(1, Math.floor(this.ctx.sampleRate*d));
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<len;i++) data[i] = (Math.random()*2-1)*Math.pow(1-i/len,1.5);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const flt = this.ctx.createBiquadFilter(); flt.type='bandpass'; flt.frequency.value=f; flt.Q.value=q;
    const g = this.ctx.createGain(); g.gain.value = v;
    src.connect(flt); flt.connect(g); g.connect(dest || this.sfxGain);
    src.start(t);
  },
  flap(){ this.noise({d:0.07, v:0.35, f:2200, q:0.8}); this.tone({f:340, d:0.07, type:'triangle', v:0.2, slide:260}); },
  score(){ this.tone({f:784, d:0.08, type:'sine', v:0.45}); this.tone({f:1174.7, d:0.16, type:'sine', v:0.4, at:0.07}); },
  hit(){ this.tone({f:150, d:0.22, type:'square', v:0.5, slide:-90}); this.noise({d:0.18, v:0.5, f:500, q:0.7}); },
  die(){ this.tone({f:500, d:0.6, type:'sawtooth', v:0.3, slide:-380, at:0.15}); },
  boom(){ this.tone({f:90, d:0.35, type:'sine', v:0.7, slide:-40}); this.noise({d:0.25, v:0.4, f:300, q:0.5}); },
  scream(){
    this.tone({f:1100, d:0.9, type:'sawtooth', v:0.5, slide:-750});
    this.tone({f:1150, d:0.9, type:'sawtooth', v:0.35, slide:-800, at:0.02});
    this.noise({d:0.8, v:0.3, f:1800, q:0.5});
  },
  unlock(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>this.tone({f, d:0.22, type:'triangle', v:0.35, at:i*0.09})); },
  reveal(){ [660, 880, 1108.7].forEach((f,i)=>this.tone({f, d:0.18, type:'triangle', v:0.4, at:i*0.08})); },
  legendary(){
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f,i)=>this.tone({f, d:0.3, type:'triangle', v:0.4, at:i*0.1}));
    this.tone({f:1568, d:0.7, type:'sine', v:0.25, at:0.5});
    this.noise({d:0.5, v:0.2, f:4000, q:0.4, at:0.5});
  },
  click(){ this.tone({f:700, d:0.05, type:'square', v:0.12}); },
  /* --- music sequencer --- */
  timer:null, step:0, nextTime:0, mode:null,

  POOL:['day','night','chill','hype','mystery','sunset','forest','city','storm','dream','ocean','candy','space','jungle','meadow'],
   FEVER_POOL:['hype','inferno','rush','candy','jungle'],
   randomTrack(){ return this.POOL[Math.floor(Math.random()*this.POOL.length)]; },
   randomFever(){ return this.FEVER_POOL[Math.floor(Math.random()*this.FEVER_POOL.length)]; },
  startMusic(mode){
    this.stopMusic();
    if(!this.ctx) return;
    this.mode = mode; this.step = 0;
    this.nextTime = this.ctx.currentTime + 0.1;
    this.timer = setInterval(()=>this.schedule(), 100);
  },
  stopMusic(){ if(this.timer){ clearInterval(this.timer); this.timer=null; } },
  schedule(){
    const tr = this.TRACKS[this.mode] || this.TRACKS.day;
    const stepDur = 60/tr.bpm/2;
    while(this.nextTime < this.ctx.currentTime + 0.3){
      this.playStep(this.step, this.nextTime);
      this.nextTime += stepDur; this.step++;
    }
  },
  playStep(step, t){
    const M = m => 440*Math.pow(2,(m-69)/12);
    const tr = this.TRACKS[this.mode] || this.TRACKS.day;
    const mel = tr.mel[step%16];
    const bas = tr.bas[step%16];
    const at = t - this.ctx.currentTime;
    if(mel) this.tone({f:M(mel), d:tr.melD||0.16, type:tr.melType, v:tr.melV, at, dest:this.musicGain});
    if(bas) this.tone({f:M(bas), d:0.3,  type:'sine', v:0.5, at, dest:this.musicGain});
    if(step % tr.hat === tr.hat/2) this.noise({d:0.03, v:0.05, f:6000, q:1, at, dest:this.musicGain});
  },
};

  silW = Math.max(W*2, ...silhouettes.map(s => s.x + s.w));

function nightFactor(){
  const dayT = (t % DAY_LEN) / DAY_LEN;
  return (1 - Math.cos(TAU*dayT)) / 2;   // 0 = noon, 1 = midnight
}

function reset(){
  bird = { y:H*0.45, vy:0, rot:0, wing:0 };
  pipes = []; particles = []; popups = []; trail = [];
  score = 0; shake = 0; flash = 0;
  combo = 0; feverT = 0;
  const pw = powers();
  shield = pw.shield; revive = pw.revive + (hasRelic('phoenix') ? 1 : 0); invuln = 0; rebornT = 0;
  nextMoverAt = t + rand(10,15);
  nextMusicSwitch = t + rand(20,35);
  deathTimer = 0; overShown = false;
