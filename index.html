<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flying Low Against Pipes Provokes Yelling</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div><div id="score">0</div><div id="powerTag"></div><div id="comboTag"></div><div id="rlHud" class="hidden"><span id="rlHearts"></span><span id="rlGold"></span><span id="rlStage"></span></div><div id="runItems" class="hidden"></div></div>
    <div id="hudBtns">
      <button class="iconBtn" id="muteBtn" title="Sound (M)">SND</button>
      <button class="iconBtn" id="pauseBtn" title="Pause (P)">II</button>
    </div>
  </div>

  <div id="menu" class="panel">
    <div class="card">
      <h1><span class="word"><span class="acro">F</span>lying</span> <span class="word"><span class="acro">L</span>ow</span> <span class="word"><span class="acro">A</span>gainst</span> <span class="word"><span class="acro">P</span>ipes</span> <span class="word"><span class="acro">P</span>rovokes</span> <span class="word"><span class="acro">Y</span>elling</span></h1>
      <canvas id="menuBird" width="100" height="100"></canvas>
      <p class="stat"><span id="lblBest">BEST</span> <b id="menuBest">0</b> &nbsp;•&nbsp; <span id="lblTotal">TOTAL</span> <b id="menuTotal">0</b></p>
      <p class="hint" id="menuPower"></p>
      <div class="menuRow">
        <button class="skinPrev" id="skinsBtn" title="Characters"><canvas id="skinPrev" width="56" height="56"></canvas></button>
      </div>
      <button class="btn" id="playBtn">PLAY</button>
      <div class="langRow">
        <button class="flagBtn" id="langBR" title="Português (BR)"><svg viewBox="0 0 30 20" width="30" height="20"><rect width="30" height="20" fill="#009c47"/><polygon points="15,4 26,10 15,16 4,10" fill="#ffdf00"/><circle cx="15" cy="10" r="4.5" fill="#002776"/></svg></button>
        <button class="flagBtn" id="langUS" title="English (US)"><svg viewBox="0 0 30 20" width="30" height="20"><rect width="30" height="20" fill="#fff"/><rect y="2.8" width="30" height="2.8" fill="#b22234"/><rect y="8.5" width="30" height="2.8" fill="#b22234"/><rect y="14.2" width="30" height="2.8" fill="#b22234"/><rect width="13" height="11.4" fill="#3c3b6e"/></svg></button>
      </div>
      <div class="langRow">
        <button class="flagBtn" id="helpBtn" title="How to play">?</button>
      </div>
     </div>
  </div>

  <div id="gameover" class="panel hidden">
    <div class="card">
      <h2 id="goTitle">GAME OVER</h2>
      <div id="medalBox"><div id="medal">—</div></div>
      <div class="scoreRow">
        <div><span id="lblScore">SCORE</span><b id="finalScore">0</b></div>
        <div><span id="lblBest2">BEST</span><b id="bestScore">0</b></div>
      </div>
      <div id="newRecord" class="hidden">NEW RECORD!</div>
      <p id="rlStats" class="hidden"></p>
      <button class="btn" id="retryBtn">PLAY AGAIN</button>
      <button class="btn ghost" id="skinsBtnOver">SKINS</button>
    </div>
  </div>

  <div id="shop" class="panel hidden">
    <div class="card">
      <div id="shopTop">
        <h2 id="shopTitle">SKINS</h2>
       </div>
      <div id="skinGrid"></div>
      <button class="btn ghost" id="shopClose">CLOSE</button>
    </div>
  </div>

  <div id="draft" class="panel hidden">
    <div class="card">
      <h2 id="draftTitle">UPGRADE</h2>
      <p class="hint" id="draftHint">Pick an upgrade</p>
      <div id="draftCards"></div>
    </div>
  </div>

  <div id="map" class="panel hidden">
    <div class="card">
      <h2 id="mapTitle">THE PATH</h2>
      <p class="hint" id="mapHint">Tap a glowing node</p>
      <div id="mapBox"></div>
    </div>
  </div>

  <div id="victory" class="panel hidden">
    <div class="card">
      <h2 id="victoryTitle">VICTORY!</h2>
      <p class="hint" id="victoryStats"></p>
      <button class="btn" id="continueBtn">CONTINUE → PATH 2</button>
      <button class="btn ghost" id="victoryBtn">PLAY AGAIN</button>
    </div>
  </div>

  <div id="chest" class="panel hidden">
    <div class="card">
      <h2 id="chestTitle">CHEST</h2>
      <p id="chestReward" class="hint">???</p>
      <button class="btn" id="chestOpen">OPEN</button>
    </div>
  </div>

  <div id="reveal" class="hidden">
    <div id="revealCard">
      <div id="revealIcon"></div>
      <div id="revealTitle"></div>
      <div id="revealDesc"></div>
      <button class="btn" id="revealBtn">INCREDIBLE!</button>
    </div>
  </div>

  <div id="merchant" class="panel hidden">
    <div class="card">
      <h2 id="merchTitle">MERCHANT</h2>
      <p id="merchantGold" class="hint"></p>
      <div id="merchantOffers">
        <button class="draftCard" id="merchHeal"><span class="dcName">Heal 1 HP</span><span class="dcDesc">15g</span></button>
        <button class="draftCard" id="merchShield"><span class="dcName">Shield</span><span class="dcDesc">+1 shield charge — 25g</span></button>
        <button class="draftCard" id="merchTough"><span class="dcName">Tough</span><span class="dcDesc">+1 max HP, heal 1 — 30g</span></button>
        <button class="draftCard" id="merchChip"><span class="dcName">Fever Chip</span><span class="dcDesc">Fever threshold -10 — 25g</span></button>
        <button class="draftCard" id="merchCoin"><span class="dcName">Lucky Coin</span><span class="dcDesc">Pay 20g, gain 35g</span></button>
        <button class="draftCard" id="merchPhoenix"><span class="dcName">Phoenix</span><span class="dcDesc">+1 revive — 40g</span></button>
        <button class="draftCard" id="merchAnchor"><span class="dcName">Anchor</span><span class="dcDesc">Base magnet 2 — 35g</span></button>
        <button class="draftCard" id="merchReroll"><span class="dcName">Reroll Draft</span><span class="dcDesc">10g</span></button>
      </div>
      <p class="hint" id="merchHint">Next draft — pick one after leaving</p>
      <div id="merchantDraft"></div>
      <button class="btn" id="merchLeave">LEAVE</button>
    </div>
  </div>

  <div id="help" class="panel hidden">
    <div class="card">
      <h2 id="helpTitle">HOW TO PLAY</h2>
      <div id="helpBody"></div>
      <button class="btn" id="helpClose">CLOSE</button>
    </div>
  </div>

  <div id="tooltip"></div>
  <div id="toast" class="hidden"></div>
  <div id="pauseOverlay" class="hidden">
    <div class="card">
      <h2 id="pauseTitle">PAUSED</h2>
      <button class="btn" id="pauseResume">RESUME</button>
      <button class="btn ghost" id="pauseHelp">HELP</button>
      <button class="btn ghost" id="pauseMenu">MAIN MENU</button>
    </div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/i18n.js"></script>
<script src="js/roguelike.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
